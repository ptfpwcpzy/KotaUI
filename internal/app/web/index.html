function render(){clearInterval(refreshTimer);root.innerHTML=`<div class="app">${nav()}<main class="main"><header class="topbar"><button class="icon mobile-menu" onclick="toggleDrawer()" aria-label="打开菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="top-brand home-link" type="button" onclick="go('dashboard')" aria-label="返回仪表盘"><div><h1>KotaUI</h1></div></button></header><section id="view"></section><footer class="page-footer"><b>作者：那么羡慕你</b><span>·</span>仅供学习自用，请勿随意传播。</footer></main></div>`;({dashboard:viewDashboard,inbounds:viewInbounds,clients:viewClients,settings:viewSettings})[tab]();if(tab==='dashboard'&&!gaugesSwept){gaugesSwept=true;sweepGauges()}scheduleDashboardRefresh()}function scheduleDashboardRefresh(){clearInterval(refreshTimer);refreshTimer=0;if(tab==='dashboard'&&!document.hidden)refreshTimer=setInterval(refreshDashboard,2000)}function go(next){tab=next;drawer=false;render()}function toggleDrawer(){drawer=!drawer;document.querySelector('.backdrop')?.classList.toggle('show',drawer);document.querySelector('.sidebar')?.classList.toggle('open',drawer)}function closeDrawer(){if(!drawer)return;drawer=false;document.querySelector('.backdrop')?.classList.remove('show');document.querySelector('.sidebar')?.classList.remove('open')}async function refreshDashboard(){if(document.hidden||tab!=='dashboard'||drawer)return;try{dash=await api('/api/dashboard');sampleNetwork(dash.metrics);viewDashboard()}catch{}}function updateButtonBusy(busy){const button=document.querySelector('.maintenance-update');if(!button)return;button.disabled=busy;button.textContent=busy?'正在更新 KotaUI…':'更新 KotaUI'}function rememberUpdateCompletion(message){try{sessionStorage.setItem('kotaui.update.completion',message)}catch{}}function consumeUpdateCompletion(){try{const message=sessionStorage.getItem('kotaui.update.completion'
