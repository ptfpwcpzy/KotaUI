<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KotaUI</title><style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#17213a;--muted:#71809b;--line:#e5eaf2;--blue:#3569ee;--blue-soft:#edf2ff;--green:#13a779;--red:#e14d5a;--amber:#e89d28;--shadow:0 12px 30px rgba(31,52,94,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;transition:.18s}button:active{transform:scale(.98)}button.alt{background:var(--blue-soft);color:#2e55bc}button.danger{background:#fff0f1;color:#cc3e4b}button.icon{padding:9px 11px;background:#fff;color:#53627e;border:1px solid var(--line)}input,textarea,select{width:100%;border:1px solid #d8e0ec;border-radius:10px;padding:10px 11px;background:#fff;outline:0}input:focus,textarea:focus,select:focus{border-color:#7898f8;box-shadow:0 0 0 3px #3569ee16}.hidden{display:none!important}.sub{color:var(--muted);font-size:12px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.app{min-height:100vh}.sidebar{width:250px;position:fixed;inset:0 auto 0 0;padding:24px 15px;background:linear-gradient(160deg,#fff,#f8faff);border-right:1px solid var(--line);z-index:20}.brand{display:flex;gap:11px;align-items:center;padding:0 9px 21px}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#2f61e9,#82a1ff);box-shadow:0 9px 20px #3569ee36;color:#fff}.logo svg{width:25px;height:25px}.brand b{font-size:22px;letter-spacing:-.7px}.nav{width:100%;display:flex;align-items:center;gap:10px;background:transparent;color:#53617b;text-align:left;margin:4px 0;padding:11px 13px}.nav.on{background:var(--blue-soft);color:#3159c5}.nav i{font-style:normal;width:22px;text-align:center;font-size:16px}.foot{position:absolute;bottom:22px;left:24px;right:20px;font-size:12px;color:#8793a8;line-height:1.7}.main{margin-left:250px;padding:29px;max-width:1440px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top-title{display:flex;align-items:center;gap:10px}.top-title h1{font-size:27px;margin:0;letter-spacing:-1px}.top-title .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #13a77915}.mobile-menu{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.dashboard-head{padding:19px 21px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.dashboard-head .host{font-weight:800;font-size:17px}.dashboard-head .host small{font-size:12px;color:var(--muted);font-weight:500;margin-left:7px}.gauge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px}.gauge{text-align:center;padding:7px 3px}.dial{--p:0;--c:var(--blue);width:108px;height:108px;margin:0 auto 10px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#edf0f5 0);position:relative;display:grid;place-items:center}.dial:before{content:"";width:82px;height:82px;background:#fff;border-radius:50%;position:absolute}.dial b{z-index:1;font-size:18px;letter-spacing:-.5px}.gauge label{display:block;font-weight:750;font-size:14px}.gauge span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.dash-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}.section{padding:20px}.section h2{font-size:16px;margin:0 0 14px}.service{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.service:last-child{border:0}.service-name b{display:block}.status{font-size:13px;font-weight:700}.status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:5px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{background:#f7f9fd;color:#425274;border:1px solid var(--line);text-align:left;padding:13px}.quick strong{display:block;color:var(--ink);font-size:14px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.summary div{padding:13px;border-radius:13px;background:#f7f9fd}.summary span{display:block;color:var(--muted);font-size:12px}.summary b{font-size:19px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.page-head h2{font-size:24px;margin:0 0 3px;letter-spacing:-.6px}.list{display:grid;gap:11px}.item{padding:17px;display:flex;align-items:center;justify-content:space-between;gap:14px}.item-main{min-width:0}.item-main b{font-size:16px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.badge{font-size:11px;font-weight:700;color:#53627e;background:#f0f3f8;padding:3px 7px;border-radius:99px}.badge.blue{color:#2c58c4;background:#edf2ff}.item-meta{color:var(--muted);font-size:12px;white-space:nowrap}.item-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.modal{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:#17244c77;padding:clamp(14px,5vh,45px) 18px calc(120px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}.dialog{width:min(690px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:#fff;border-radius:21px;padding:24px;box-shadow:0 25px 70px #10204e44}.dialog h2{margin:0 0 4px;font-size:22px}.dialog-actions{position:sticky;bottom:-24px;margin:22px -24px -24px;padding:15px 24px;background:#fff;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.fields label{font-weight:700;color:#42506a}.full{grid-column:1/-1}.protocols{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.protocol{padding:13px 10px;text-align:center;background:#f7f9fd;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:750;color:#526078}.protocol.on{background:var(--blue-soft);color:#3158c3;border-color:#adc1ff}.reality-card{padding:14px;border:1px solid #dce5f4;border-radius:14px;background:#fbfcff}.reality-card h3{margin:0 0 3px;font-size:15px}.candidate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px;max-height:175px;overflow:auto}.candidate{border:1px solid var(--line);background:#fff;color:#46536c;text-align:left;padding:8px 9px;font-size:12px}.candidate.on{border-color:#7194f5;background:var(--blue-soft);color:#294fba}.test-line{margin-top:10px;padding:10px 11px;border-radius:10px;background:#f3f6fb;color:#62708a;font-size:12px}.test-line.ok{color:#087d5b;background:#edfbf5}.test-line.fail{color:#bf3b47;background:#fff2f3}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}.detail-grid div{background:#f7f9fd;border-radius:12px;padding:11px}.detail-grid span{display:block;color:var(--muted);font-size:11px}.subscription{background:#f6f8fd;border:1px dashed #cfd9eb;border-radius:12px;padding:11px;word-break:break-all;color:#405174;font-size:12px}.toast{position:fixed;z-index:100;left:50%;bottom:25px;transform:translateX(-50%) translateY(90px);padding:11px 15px;border-radius:12px;background:#1d2a45;color:#fff;box-shadow:0 12px 30px #10204e38;transition:.24s;max-width:calc(100vw - 32px)}.toast.show{transform:translateX(-50%) translateY(0)}.login{display:grid;place-items:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 10% 10%,#dce8ff,transparent 32%),radial-gradient(circle at 90% 90%,#e4edff,transparent 33%),var(--bg)}.login-card{width:min(410px,100%);padding:31px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 65px #1a315f1f}.login-card .brand{padding:0 0 20px}.login-card button{width:100%;margin-top:18px}.login-card label{display:block;margin-top:12px;font-weight:700;color:#43516a}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.22s;box-shadow:20px 0 45px #17244c22}.sidebar.open{transform:translateX(0)}.main{margin:0;padding:18px}.mobile-menu{display:inline-flex}.topbar{margin-bottom:17px}.top-title h1{font-size:20px}.dashboard-head{padding:15px 16px}.gauge-grid{grid-template-columns:repeat(2,1fr);padding:15px;gap:6px}.dash-grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.item-actions{justify-content:flex-start}.item-meta{white-space:normal}.dialog{padding:20px;max-height:calc(100dvh - 20px)}.dialog-actions{bottom:-20px;margin:19px -20px -20px;padding:13px 20px}.fields{grid-template-columns:1fr}.protocols{grid-template-columns:1fr}.candidate-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.foot{display:none}}@media(max-width:380px){.dial{width:95px;height:95px}.dial:before{width:71px;height:71px}.gauge label{font-size:13px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const root=document.querySelector('#app'),toastBox=document.querySelector('#toast');let state,dash,tab='dashboard',drawer=false,refreshTimer;const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16.5 4.5 19 4 15l-1.5-3L4 8l3-2.5L12 7l5-1.5L20 8l1.5 4-1.5 3 .5 4-2.5-2.5-3 1.5-3-1.5-3 1.5Z"/><path d="M8.5 12h.01M15.5 12h.01M9.5 15.5c1.7 1.2 3.3 1.2 5 0"/></svg>';const api=async(url,opt={})=>{const r=await fetch(url,{headers:{'content-type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.headers.get('content-type')?.includes('json')?r.json():r.text()};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const bytes=n=>n?`${(n/1073741824).toFixed(n>=1073741824?1:2)} GB`:'0 B';const pct=(used,total)=>total?Math.max(0,Math.min(100,used*100/total)):0;const uptime=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return `${d?d+'天 ':''}${h}时${m}分`};function toast(msg){toastBox.textContent=msg;toastBox.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toastBox.classList.remove('show'),2600)}
async function load(){try{[state,dash]=await Promise.all([api('/api/state'),api('/api/dashboard')]);render()}catch{login()}}function brand(){return `<div class=brand><div class=logo>${icon}</div><div><b>KotaUI</b><div class=sub>轻量 sing-box 管理面板</div></div></div>`}function login(){clearInterval(refreshTimer);root.innerHTML=`<main class=login><form id=login class=login-card>${brand()}<p class=sub>使用安装时设置的管理员账号登录。</p><label>账号<input name=username required autocomplete=username placeholder="管理员账号"></label><label>密码<input name=password required type=password autocomplete=current-password placeholder="管理员密码"></label><button>进入控制台</button><p class=sub style="margin:18px 0 0">仅供学习自用，请妥善保管密码。</p></form></main>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(x){toast(x.message)}}}
function nav(){const items=[['dashboard','仪表盘','◌'],['inbounds','入站','◇'],['clients','客户端','♙'],['settings','设置','⚙']];return `<aside class="sidebar ${drawer?'open':''}">${brand()}${items.map(x=>`<button class="nav ${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[2]}</i>${x[1]}</button>`).join('')}<div class=foot>KotaUI · 作者那么羡慕你<br>仅供学习自用，请勿随意传播。</div></aside>`}function render(){clearInterval(refreshTimer);root.innerHTML=`<div class=app>${nav()}<main class=main><header class=topbar><div class=top-title><button class="icon mobile-menu" onclick="toggleDrawer()">☰</button><span class=dot></span><div><h1>${{dashboard:'系统状态',inbounds:'入站管理',clients:'客户端管理',settings:'设置'}[tab]}</h1><div class=sub>${tab==='dashboard'?'实时服务器与服务状态':tab==='inbounds'?'创建、编辑、启停协议入站':tab==='clients'?'管理订阅、流量、期限和在线限制':'面板、证书与全局维护'}</div></div></div><button class=icon onclick="load()">↻</button></header><section id=view></section></main></div>`;({dashboard:viewDashboard,inbounds:viewInbounds,clients:viewClients,settings:viewSettings})[tab]();if(tab==='dashboard')refreshTimer=setInterval(()=>loadDashboard(),5000)}function go(v){tab=v;drawer=false;render()}function toggleDrawer(){drawer=!drawer;render()}async function loadDashboard(){try{dash=await api('/api/dashboard');if(tab==='dashboard')viewDashboard()}catch{}}
function gauge(name,used,total,detail,color='#3569ee'){const p=pct(used,total);return `<div class=gauge><div class=dial style="--p:${p};--c:${color}"><b>${p.toFixed(1)}%</b></div><label>${name}</label><span>${detail}</span></div>`}function viewDashboard(){const m=dash.metrics,memUsed=m.memoryTotal-m.memoryAvailable,swapUsed=m.swapTotal-m.swapFree,diskUsed=m.diskTotal-m.diskFree;document.querySelector('#view').innerHTML=`<div class="card dashboard-head"><div><div class=host>${esc(m.hostname||'服务器')}<small>${m.kernel||''} · 已运行 ${uptime(m.uptime||0)}</small></div><div class=sub>负载 ${m.load.map(x=>x.toFixed(2)).join(' / ')} · 每 5 秒自动刷新</div></div><span class=green>● 实时</span></div><div class="card gauge-grid">${gauge(`CPU · ${m.cpuCount} 核`,m.cpuPercent,100,`${m.cpuPercent.toFixed(1)}%`)}${gauge('内存',memUsed,m.memoryTotal,`${bytes(memUsed)} / ${bytes(m.memoryTotal)}`,'#21a37b')}${gauge('交换空间',swapUsed,m.swapTotal,`${bytes(swapUsed)} / ${bytes(m.swapTotal)}`,'#d98a24')}${gauge('存储',diskUsed,m.diskTotal,`${bytes(diskUsed)} / ${bytes(m.diskTotal)}`,'#765fe8')}</div><div class=dash-grid><div class="card section"><h2>服务状态</h2>${dash.services.map(s=>`<div class=service><div class=service-name><b>${esc(s.name)}</b><span class="status ${s.running?'green':'red'}">${s.running?'运行中':'未运行'}</span></div><div class=item-actions><button class=alt onclick="service('${s.id}','restart')">重启</button>${s.id==='singbox'?'<button class=alt onclick="go(\'inbounds\')">管理入站</button>':''}</div></div>`).join('')}<div class=service><div class=service-name><b>证书状态</b><span class="status ${dash.certificate.valid?'green':dash.certificate.present?'amber':'red'}">${esc(dash.certificate.message)}${dash.certificate.valid?' · 剩余 '+dash.certificate.days+' 天':''}</span></div><button class=alt onclick="go('settings')">维护</button></div></div><div class="card section"><h2>快捷操作</h2><div class=quick><button onclick="inboundModal()"><strong>＋ 新增入站</strong><span class=sub>创建协议节点</span></button><button onclick="clientModal()"><strong>＋ 新增客户端</strong><span class=sub>生成订阅信息</span></button><button onclick="go('clients')"><strong>客户端管理</strong><span class=sub>${dash.activeClients} 个当前可用</span></button><button onclick="go('settings')"><strong>配置与证书</strong><span class=sub>校验、备份、维护</span></button></div><div class=summary style="margin-top:16px"><div><span>入站</span><b>${dash.inboundCount}</b></div><div><span>客户端</span><b>${dash.clientCount}</b></div><div><span>累计流量</span><b>${bytes(dash.totalUsed)}</b></div><div><span>本月流量</span><b>${bytes(dash.monthlyUsed)}</b></div></div></div></div>`}
function viewInbounds(){const list=state.inbounds;document.querySelector('#view').innerHTML=`<div class=page-head><div><h2>入站</h2><p class=sub>维护协议、端口、状态与 REALITY 伪装域名。</p></div><button onclick="inboundModal()">＋ 新增入站</button></div><div class=list>${list.map(i=>`<article class="card item"><div class=item-main><b>${esc(i.name)}</b><div class=badges><span class="badge blue">${esc(protocolName(i.type))}</span><span class=badge>${i.enabled?'启用':'已暂停'}</span>${i.type==='reality'?`<span class=badge>${esc(i.handshakeServer)}</span>`:''}</div></div><div class=item-meta>端口 ${i.port} · ${i.type==='reality'?'SNI '+esc(i.sni):i.type==='hysteria2'?`${i.upMbps}/${i.downMbps} Mbps`:'2022'}</div><div class=item-actions><button class=alt onclick="toggleInbound('${i.id}')">${i.enabled?'暂停':'启用'}</button><button class=alt onclick="editInbound('${i.id}')">编辑</button><button class=danger onclick="deleteInbound('${i.id}')">删除</button></div></article>`).join('')||'<div class="card section"><h2>尚未创建入站</h2><p class=sub>点击“新增入站”即可开始创建 VLESS + REALITY、Hysteria 2 或 Shadowsocks 2022 入站。</p></div>'}</div>`}function protocolName(t){return({reality:'VLESS + REALITY',hysteria2:'Hysteria 2',shadowsocks2022:'Shadowsocks 2022'})[t]||t}
function inboundModal(existing){let type=existing?.type||'reality';const save=async form=>{const x=Object.fromEntries(form);x.type=type;x.port=Number(x.port);x.handshakePort=Number(x.handshakePort||443);x.upMbps=Number(x.upMbps||0);x.downMbps=Number(x.downMbps||0);const url=existing?'/api/inbounds/'+existing.id:'/api/inbounds';const method=existing?'PATCH':'POST';await api(url,{method,body:JSON.stringify(x)});closeModal();await load();toast(existing?'入站已保存':type==='reality'?'入站已创建，REALITY 密钥已自动生成':'入站已创建')};openModal(`<h2>${existing?'编辑入站':'新增入站'}</h2><p class=sub>选择协议并填写必要参数；REALITY 密钥和 Short ID 将自动生成。</p><div class=protocols>${[['reality','VLESS + REALITY'],['hysteria2','Hysteria 2'],['shadowsocks2022','Shadowsocks 2022']].map(x=>`<button type=button class="protocol ${type===x[0]?'on':''}" data-proto="${x[0]}">${x[1]}</button>`).join('')}</div><form id=inboundForm class=fields><label>名称<input name=name required value="${esc(existing?.name||'')}" placeholder="例如 HK-REALITY"></label><label>监听端口<input name=port type=number required value="${existing?.port||Math.floor(20000+Math.random()*35000)}"></label><label class=full>监听地址<input name=listen value="${esc(existing?.listen||'0.0.0.0')}"></label><div class=full id=protocolFields></div></form><div class=dialog-actions><button class=alt onclick="closeModal()">取消</button><button onclick="document.querySelector('#inboundForm').requestSubmit()">${existing?'保存修改':'创建入站'}</button></div>`,async()=>{});const form=document.querySelector('#inboundForm');const renderFields=()=>{const i=existing||{};const box=document.querySelector('#protocolFields');if(type==='reality'){box.innerHTML=`<div class=reality-card><h3>伪装域名</h3><p class=sub>选择候选或输入自定义域名。选择后自动测试延迟与 TLS 条件，并自动作为 SNI 使用。</p><div class=candidate-grid>${state.settings.realityCandidates.map(c=>`<button type=button class="candidate ${i.handshakeServer===c.host?'on':''}" onclick="pickCandidate('${esc(c.host)}',${c.port})">${esc(c.host)}<br><span class=sub>${c.port}</span></button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:10px"><input id=handshakeServer name=handshakeServer value="${esc(i.handshakeServer||'www.cloudflare.com')}" placeholder="自定义伪装域名"><input id=handshakePort name=handshakePort type=number value="${i.handshakePort||443}" style="max-width:92px"></div><div id=sniResult class="test-line">选择或输入域名后将自动测试。</div></div><label>SNI<input id=sni name=sni value="${esc(i.sni||i.handshakeServer||'www.cloudflare.com')}" required></label><label>备注 <span class=sub>密钥与 Short ID 由系统自动处理</span><input disabled value="创建时自动生成"></label>`}else if(type==='hysteria2'){box.innerHTML=`<label>上行 Mbps<input name=upMbps type=number value="${i.upMbps||50}"></label><label>下行 Mbps<input name=downMbps type=number value="${i.downMbps||200}"></label><label class=full>TLS server_name<input name=sni required value="${esc(i.sni||state.settings.domain)}"></label><label class=full>混淆密码 <span class=sub>可留空</span><input name=obfsPassword value="${esc(i.obfsPassword||'')}"></label>`}else{box.innerHTML='<div class="reality-card">固定算法：2022-blake3-aes-256-gcm。服务端和客户端密钥均由系统安全生成。</div>'}};document.querySelectorAll('[data-proto]').forEach(b=>b.onclick=()=>{type=b.dataset.proto;document.querySelectorAll('[data-proto]').forEach(x=>x.classList.toggle('on',x===b));renderFields()});form.onsubmit=async e=>{e.preventDefault();try{await save(new FormData(form))}catch(err){toast(err.message)}};renderFields();if(type==='reality')setTimeout(testReality,20)}function pickCandidate(host,port){const h=document.querySelector('#handshakeServer'),p=document.querySelector('#handshakePort'),s=document.querySelector('#sni');if(h){h.value=host;p.value=port;s.value=host;testReality()}}async function testReality(){const host=document.querySelector('#handshakeServer')?.value.trim(),port=Number(document.querySelector('#handshakePort')?.value||443),box=document.querySelector('#sniResult');if(!host||!box)return;box.className='test-line';box.textContent='正在测试 VPS 到伪装域名的 TLS 延迟…';try{const r=await api('/api/reality/test',{method:'POST',body:JSON.stringify({host,port})});box.className='test-line '+(r.ok?'ok':'fail');box.textContent=r.ok?`${r.message} · ${r.latencyMs} ms · ${r.tlsVersion}${r.certificate?' · '+r.certificate:''}`:r.message}catch(e){box.className='test-line fail';box.textContent='测试失败：'+e.message}}function editInbound(id){inboundModal(state.inbounds.find(x=>x.id===id))}async function toggleInbound(id){try{await api('/api/inbounds/'+id+'/toggle',{method:'POST'});await load();toast('入站状态已切换')}catch(e){toast(e.message)}}async function deleteInbound(id){try{await api('/api/inbounds/'+id,{method:'DELETE'});await load();toast('入站已删除，相关订阅会自动更新')}catch(e){toast(e.message)}}
function viewClients(){document.querySelector('#view').innerHTML=`<div class=page-head><div><h2>客户端</h2><p class=sub>统一管理多入站绑定、流量、期限、在线 IP 限制与订阅。</p></div><button onclick="clientModal()">＋ 新增客户端</button></div><div class=list>${state.clients.map(c=>`<article class="card item" onclick="clientDetail('${c.id}')"><div class=item-main><b>${esc(c.username)}</b><div class=badges><span class="badge blue">${c.inboundIds.length} 个入站</span><span class=badge>${c.paused?'已暂停':'正常'}</span>${c.expiresAt?`<span class=badge>至 ${esc(c.expiresAt)}</span>`:''}</div></div><div class=item-meta>${bytes(c.usedBytes)} / ${c.totalLimitBytes?bytes(c.totalLimitBytes):'不限'}<br>本月 ${bytes(c.monthlyUsedBytes)}</div><div class=item-actions onclick="event.stopPropagation()"><button class=alt onclick="clientDetail('${c.id}')">详情</button><button class=danger onclick="clientAction('${c.id}','delete')">删除</button></div></article>`).join('')||'<div class="card section"><h2>尚无客户端</h2><p class=sub>请先创建至少一个入站，再添加客户端并生成订阅地址。</p></div>'}</div>`}function clientModal(){if(!state.inbounds.length){toast('请先创建入站');go('inbounds');return}openModal(`<h2>新增客户端</h2><p class=sub>创建后将立即显示订阅地址与使用信息。</p><form id=clientForm class=fields><label>用户名<input name=username required pattern="[A-Za-z0-9_-]{3,32}" placeholder="3–32 位字母、数字、下划线或连字符"></label><label>管理员备注<input name=note placeholder="例如 Alice 的手机"></label><label class=full>绑定入站<div class=badges style="margin-top:7px">${state.inbounds.filter(i=>i.enabled).map(i=>`<label class=badge style="padding:7px 10px"><input type=checkbox name=inbound value="${i.id}" checked style="width:auto"> ${esc(i.name)} · ${esc(protocolName(i.type))}</label>`).join('')}</div></label><label>总流量上限（GiB，0 为不限）<input name=total type=number min=0 value=0></label><label>自然月流量（GiB，0 为不限）<input name=monthly type=number min=0 value=0></label><label>有效期 <span class=sub>留空不限</span><input name=expiresAt type=date></label><label>同时在线 IP 数 <span class=sub>0 为不限</span><input name=maxOnlineIps type=number min=0 value=0></label></form><div class=dialog-actions><button class=alt onclick="closeModal()">取消</button><button onclick="document.querySelector('#clientForm').requestSubmit()">创建客户端</button></div>`,async()=>{});document.querySelector('#clientForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),x=Object.fromEntries(f);x.inboundIds=f.getAll('inbound');x.totalLimitBytes=Math.round(Number(x.total||0)*1073741824);x.monthlyLimitBytes=Math.round(Number(x.monthly||0)*1073741824);x.maxOnlineIps=Number(x.maxOnlineIps||0);const c=await api('/api/clients',{method:'POST',body:JSON.stringify(x)});closeModal();await load();clientDetail(c.id);toast('客户端已创建')}catch(err){toast(err.message)}}}function clientDetail(id){const c=state.clients.find(x=>x.id===id);if(!c)return;const link=`${location.origin.replace(/:\d+$/,'')}:1109${state.settings.subscriptionPath}/${c.username}`;openModal(`<h2>${esc(c.username)}</h2><p class=sub>${esc(c.note||'客户端详情')}</p><div class=detail-grid><div><span>绑定入站</span><b>${c.inboundIds.length} 个</b></div><div><span>状态</span><b class="${c.paused?'red':'green'}">${c.paused?'已暂停':'正常'}</b></div><div><span>累计流量</span><b>${bytes(c.usedBytes)} / ${c.totalLimitBytes?bytes(c.totalLimitBytes):'不限'}</b></div><div><span>本月流量</span><b>${bytes(c.monthlyUsedBytes)} / ${c.monthlyLimitBytes?bytes(c.monthlyLimitBytes):'不限'}</b></div><div><span>有效期</span><b>${esc(c.expiresAt||'不限')}</b></div><div><span>在线 IP</span><b>${c.maxOnlineIps||'不限'}</b></div></div><div class=subscription id=subLink>${esc(link)}</div><div class=item-actions style="margin-top:14px"><button class=alt onclick="copySub()">复制订阅</button><button class=alt onclick="clientAction('${c.id}','${c.paused?'resume':'pause'}')">${c.paused?'恢复':'暂停'}</button><button class=alt onclick="clientAction('${c.id}','reset')">重置流量</button><button class=danger onclick="clientAction('${c.id}','delete')">删除</button></div><div class=dialog-actions><button class=alt onclick="closeModal()">关闭</button></div>`,async()=>{})}async function copySub(){try{await navigator.clipboard.writeText(document.querySelector('#subLink').textContent);toast('订阅地址已复制')}catch{toast('请手动复制订阅地址')}}async function clientAction(id,action){try{await api('/api/clients/'+id+'/'+action,{method:'POST'});closeModal();await load();toast(({pause:'客户端已暂停',resume:'客户端已恢复',reset:'流量已重置',delete:'客户端已删除'})[action]||'操作完成')}catch(e){toast(e.message)}}
function viewSettings(){document.querySelector('#view').innerHTML=`<div class=page-head><div><h2>设置</h2><p class=sub>维护订阅、候选伪装域名、证书与配置。</p></div></div><div class="card section"><h2>面板与订阅</h2><form id=settings class=fields><label>面板名称<input name=panelName value="${esc(state.settings.panelName)}"></label><label>订阅路径 <span class=sub>创建后客户端订阅自动更新</span><input disabled value="${esc(state.settings.subscriptionPath)}"></label><label class=full>REALITY 候选伪装域名 <span class=sub>每行：域名:端口；仅在创建 REALITY 入站时显示为辅助卡片。</span><textarea name=candidates rows=7>${state.settings.realityCandidates.map(c=>c.host+':'+c.port).join('\n')}</textarea></label><label class=full style="display:flex;align-items:center;gap:8px"><input type=checkbox name=titleEnabled style="width:auto" ${state.settings.titleEnabled?'checked':''}> 订阅状态页显示标题信息</label><div class=full><button>保存设置</button> <button type=button class=alt onclick="validateConfig()">校验 sing-box 配置</button></div></form><pre id=configResult class=sub></pre></div>`;document.querySelector('#settings').onsubmit=saveSettings}async function saveSettings(e){e.preventDefault();try{const f=new FormData(e.target),rows=f.get('candidates').trim().split(/\n+/).filter(Boolean).map(x=>{const [host,port]=x.trim().split(':');return{host,port:Number(port||443)}});await api('/api/settings',{method:'PUT',body:JSON.stringify({panelName:f.get('panelName'),titleEnabled:f.get('titleEnabled')==='on',realityCandidates:rows})});await load();toast('设置已保存')}catch(err){toast(err.message)}}async function validateConfig(){const r=await api('/api/config/validate',{method:'POST'});document.querySelector('#configResult').textContent=r.ok?'配置校验通过':r.output||'配置校验失败'}async function service(id,action){try{const r=await api('/api/services/'+id+'/'+action,{method:'POST'});toast(r.message||'服务操作已执行');setTimeout(loadDashboard,600)}catch(e){toast(e.message)}}function openModal(html){const el=document.createElement('div');el.id='modal';el.className='modal';el.innerHTML=`<div class=dialog>${html}</div>`;document.body.append(el);document.addEventListener('focusin',focusIntoView,{once:false})}function closeModal(){document.querySelector('#modal')?.remove();document.removeEventListener('focusin',focusIntoView)}function focusIntoView(e){if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),160)}window.go=go;window.toggleDrawer=toggleDrawer;window.inboundModal=inboundModal;window.editInbound=editInbound;window.pickCandidate=pickCandidate;window.testReality=testReality;window.toggleInbound=toggleInbound;window.deleteInbound=deleteInbound;window.clientModal=clientModal;window.clientDetail=clientDetail;window.clientAction=clientAction;window.copySub=copySub;window.validateConfig=validateConfig;window.service=service;window.closeModal=closeModal;load();
</script></body></html>
