function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function bytes(v){v=Number(v||0);if(!Number.isFinite(v)||v<=0)return '0 B';if(v<1024)return Math.round(v)+' B';if(v<1048576)return(v/1024).toFixed(1)+' KB';if(v<1073741824)return(v/1048576).toFixed(1)+' MB';return(v/1073741824).toFixed(2)+' GB'}function pct(a,b){return b?Math.max(0,Math.min(100,Number(a||0)*100/Number(b))):0}function protocolName(v){return({reality:'VLESS + REALITY',hysteria2:'Hysteria 2',shadowsocks2022:'Shadowsocks 2022'})[v]||v}

function render(){clearInterval(refreshTimer);root.innerHTML=`<div class="app">${nav()}<main class="main"><header class="topbar"><button class="icon mobile-menu" onclick="toggleDrawer()" aria-label="打开菜单">☰</button><button class="top-brand home-link" type="button" onclick="go('dashboard')" aria-label="返回仪表盘"><div class="logo">${logo}</div><div><h1>KotaUI</h1></div></button></header><section id="view"></section><footer class="page-footer"><b>作者：那么羡慕你</b><span>·</span>仅供学习自用，请勿随意传播。</footer></main></div>`;({dashboard:viewDashboard,inbounds:viewInbounds,clients:viewClients,settings:viewSettings})[tab]();scheduleDashboardRefresh()}function scheduleDashboardRefresh(){clearInterval(refreshTimer);refreshTimer=0;if(tab==='dashboard'&&!document.hidden)refreshTimer=setInterval(refreshDashboard,2000)}function go(next){tab=next;drawer=false;render()}function toggleDrawer(){drawer=!drawer;render()}function closeDrawer(){if(drawer){drawer=false;render()}}async function refreshDashboard(){if(document.hidden||tab!=='dashboard')return;try{dash=await api('/api/dashboard');sampleNetwork(dash.metrics);viewDashboard()}catch{}}function maintenanceStatus(text,announce=true){const el=document.querySelector('#updateStatus');if(el)el.textContent=text;if(announce)toast(text)}async function waitForPanelRecovery(attempts=60,doneText='面板已恢复。'){for(let i=0;i<attempts;i++){await new Promise(resolve=>setTimeout(resolve,500));try{const r=await fetch('/health?ts='+Date.now(),{cache:'no-store'});if(r.ok){maintenanceStatus(doneText);await new Promise(resolve=>setTimeout(resolve,800));location.reload();return true}}catch{}}maintenanceStatus('面板尚未恢复，请查看面板日志或稍后刷新。');return false}async function waitForUpdate(attempts=1800){for(let i=0;i<attempts;i++){try{const progress=await api('/api/update/status');maintenanceStatus(progress.message||'正在更新…',false);if(progress.running){await new Promise(resolve=>setTimeout(resolve,1000));continue}if(!String(progress.message||'').includes('更新完成')){maintenanceStatus(progress.message||'更新失败，请查看更新日志。');return false}maintenanceStatus('更新完成，正在等待面板恢复…',false);return waitForPanelRecovery(120,'更新完成，面板已恢复。')}catch{await new Promise(resolve=>setTimeout(resolve,1000))}}maintenanceStatus('更新超时，请查看更新日志。');return false}async function updatePanel(){if(!confirm('将更新 KotaUI 面板、sing-box 核心和管理脚本，并在完成后重启服务。现有数据与证书不会删除。继续？'))return;maintenanceStatus('正在启动独立更新任务，请勿手动重启服务…');try{const r=await api('/api/update',{method:'POST',body:'{}'});maintenanceStatus(r.message||'更新任务已启动',false);await waitForUpdate()}catch(e){maintenanceStatus('无法启动更新：'+e.message)}}async function renewCertificate(){try{const r=await api('/api/certificate/renew',{method:'POST',body:'{}'});toast(r.message||'已开始证书续签检查')}catch(e){toast(e.message)}}async function showLogs(kind,label){openModal(`<h2>${label}</h2><p class="sub">默认显示最近 100 行，可用于定位服务、节点和证书错误。</p><pre id="logContent" class="subscription" style="max-height:45dvh;overflow:auto;white-space:pre-wrap">正在读取…</pre><div class="dialog-actions"><button class="alt" onclick="showLogs('${kind}','${label}')">刷新</button><button class="alt" onclick="navigator.clipboard.writeText(document.querySelector('#logContent').textContent).then(()=>toast('日志已复制'))">复制</button><button class="primary" onclick="closeModal()">关闭</button></div>`);try{const r=await api('/api/logs/'+kind);document.querySelector('#logContent').textContent=r.content||'暂无日志。'}catch(e){document.querySelector('#logContent').textContent='读取失败：'+e.message}}async function serviceControl(service,action){const label=service==='panel'?'面板':'sing-box 核心';if(service==='panel'&&action==='restart'){maintenanceStatus('正在重启面板，等待服务恢复…');try{await api('/api/services/panel/restart',{method:'POST',body:'{}'})}catch{}await waitForPanelRecovery(30,'面板已恢复。');return}maintenanceStatus('正在重启'+label+'…');try{const r=await api('/api/services/'+service+'/'+action,{method:'POST',body:'{}'});if(!r.ok)throw new Error(r.message||'服务操作失败');maintenanceStatus(label+'重启完成。');setTimeout(load,900)}catch(e){maintenanceStatus(label+'重启失败：'+e.message)}}
function gauge(name,used,total,detail,color){const p=pct(used,total);return `<div class="gauge"><div class="dial" style="--p:${p};--c:${color}"><b>${p.toFixed(1)}%</b></div><label>${name}</label><span>${detail}</span></div>`}function speed(v){return v===null||!Number.isFinite(v)?'采集中':bytes(v)+'/s'}function duration(v){v=Math.max(0,Number(v)||0);if(!v)return '—';const d=Math.floor(v/86400),h=Math.floor(v%86400/3600),m=Math.floor(v%3600/60);return d?d+' 天 '+h+' 小时':h?h+' 小时 '+m+' 分钟':m?m+' 分钟':'刚刚启动'}
function viewDashboard(){const m=dash.metrics||{},mem=(m.memoryTotal||0)-(m.memoryAvailable||0),swap=(m.swapTotal||0)-(m.swapFree||0),disk=(m.diskTotal||0)-(m.diskFree||0),services=dash.services||[],serviceByID=id=>services.find(x=>x.id===id)||{running:false},panel=serviceByID('panel'),core=serviceByID('singbox'),certificateOK=Boolean(dash.certificate?.valid),onlineUsers=(dash.onlineUsers||[]).slice(0,5),hints=dash.healthHints||[];const siteStats=`<section class="card section site-stats"><div class="section-head"><h2>站点统计</h2></div><div class="site-stat-grid"><div class="site-stat"><span>启用入站</span><b>${state.inbounds?.filter(x=>x.enabled).length||0} / ${dash.inboundCount||0}</b></div><div class="site-stat"><span>客户端</span><b>${dash.clientCount||0}</b></div><div class="site-stat"><span>累计流量</span><b>${bytes(dash.totalUsed)}</b></div><div class="site-stat"><span>本月流量</span><b>${bytes(dash.monthlyUsed)}</b></div></div></section>`;const health=`<section class="card dashboard-strip health-strip"><span class="service-state ${panel.running?'live':'alert'}"><i></i>面板 · ${panel.running?'正常':'异常'}</span><span class="service-state ${core.running?'live':'alert'}"><i></i>核心 · ${core.running?'正常':'异常'}</span><span class="service-state ${certificateOK?'live':'alert'}"><i></i>证书 · ${certificateOK?'有效':'异常'}</span></section>`;const online=`<section class="card dashboard-strip online-strip"><div class="online-strip-main"><b>在线用户</b><div class="online-users">${onlineUsers.length?onlineUsers.map(u=>`<span class="online-user" title="${esc(u.username)}">${esc(u.username)}</span>`).join(''):'<span class="online-user empty">暂无在线用户</span>'}</div></div><span class="online-strip-hint">${onlineUsers.length?'最近 20 秒有流量':'暂无近期流量'}</span></section>`;const notices=hints.length?`<section class="card section notice-card dashboard-notice"><div class="section-head"><h2>待处理事项</h2><button class="alt" onclick="go('settings')">查看</button></div>${hints.slice(0,3).map(h=>`<button class="notice ${esc(h.leve  class="inbound-card-content"><div class="inbound-summary"><b>端口 ${i.port}</b>${i.type==='reality'&&i.sni?`<small>SNI ${esc(i.sni)}</small>`:''}${i.type==='reality'&&i.handshakeServer&&i.handshakeServer!==i.sni?`<small>伪装域名 ${esc(i.handshakeServer)}</small>`:''}</div><div class="inbound-actions"><button class="alt inbound-action-current ${i.enabled?'':'idle'}" ${i.enabled?'disabled':''}>启用</button><button class="alt inbound-action-current ${i.enabled?'idle':''}" ${i.enabled?'':'disabled'} onclick="toggleInbound('${i.id}')">暂停</button><button class="alt" onclick="editInbound('${i.id}')">编辑</button><button class="danger" onclick="deleteInbound('${i.id}')">删除</button></div></div></article>`).join('')||'<section class="card section"><h2>尚未创建入站</h2><p class="sub">请先创建 VLESS + REALITY、Hysteria 2 或 Shadowsocks 2022 入站。</p></section>'}</div></div>`}
function inboundModal(existing,forcedType){let type=forcedType||existing?.type||'reality';openModal(`<h2>${existing?'编辑入站':'新增入站'}</h2><p class="sub">只填写必要参数；REALITY 密钥和 Short ID 由系统自动生成。</p><div class="protocols">${[['reality','VLESS + REALITY'],['hysteria2','Hysteria 2'],['shadowsocks2022','Shadowsocks 2022']].map(x=>`<button class="protocol ${type===x[0]?'on':''}" type="button" onclick="inboundModal(null,'${x[0]}')">${x[1]}</button>`).join('')}</div><form class="fields" id="inboundForm"><label>名称<input name="name" required value="${esc(existing?.name||'')}" placeholder="例如 HK-REALITY"></label><label>监听端口<input name="port" type="number" required value="${existing?.port||Math.floor(20000+Math.random()*35000)}"></label><div class="ipv6-choice"><div><b>使用 IPv6 分享地址</b><small>服务器有公网 IPv6 时，在订阅节点中优先使用 IPv6 地址</small></div><label class="switch" title="使用 IPv6 分享地址"><input type="checkbox" name="useIPv6" ${existing?.useIPv6?'checked':''}><span></span></label></div><div id="protocolFields" class="full">${protocolFields(type,existing||{})}</div></form><div class="dialog-actions"><button class="alt" onclick="closeModal()">取消</button><button class="primary" onclick="document.querySelector('#inboundForm').requestSubmit()">${existing?'保存修改':'创建入站'}</button></div>`);if(type==='reality')renderSNIRows();document.querySelector('#inboundForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),x=Object.fromEntries(f);x.type=type;x.port=Number(x.port);x.handshakePort=Number(x.handshakePort||443);x.useIPv6=f.get('useIPv6')==='on';x.upMbps=Number(x.upMbps||0);x.downMbps=Number(x.downMbps||0);const created=await api(existing?'/api/inbounds/'+existing.id:'/api/inbounds',{method:existing?'PATCH':'POST',body:JSON.stringify(x)});closeModal();await load();toast(existing?'入站已保存':type==='reality'?'入站已创建，密钥已自动生成':'入站已创建');if(!existing&&created?.id)go('inbounds')}catch(err){toast(err.message)}}}
function protocolFields(type,i={}){if(type==='reality')return realityFields(i);if(type==='hysteria2')return `<div class="reality-card"><h3>Hysteria 2 参数</h3><p class="sub">只需填写 TLS 域名；带宽与连接参数由系统按安全默认值处理。</p><label>TLS server_name<input name="sni" required value="${esc(i?.sni||state.settings.domain||'')}"></label><label>混淆密码 <span class="sub">可留空</span><input name="obfsPassword" value="${esc(i?.obfsPassword||'')}"></label></div>`;return '<div class="reality-card">固定算法：2022-blake3-aes-256-gcm。服务端和客户端密钥均由系统自动生成。</div>'}function realityFields(i={}){i=i||{};const host=esc(i.handshakeServer||'');return `<div class="reality-card"><h3>伪装域名</h3><p class="sub">填写域名后可测试；系统自动使用 HTTPS 443，并自动补全 SNI、密钥和连接参数。</p><div class="custom-sni"><input id="handshakeServer" name="handshakeServer" value="${host}" placeholder="例如 www.cloudflare.com"><input name="handshakePort" type="hidden" value="443"><button type="button" onclick="testCustomSNI()">测试</button></div><input id="sni" name="sni" value="${esc(i.sni||i.handshakeServer||'')}" type="hidden"><div id="customSNIResult"></div><div class="candidate-toolbar"><b>候选伪装域名</b><button type="button" class="test-all" onclick="testAllSNI()">全部测试</button></div><div id="candidateResults" class="candidate-results"></div></div><label>密钥与 Short ID <span class="sub">系统自动处理</span><input disabled value="创建或首次设置时自动生成"></label>`}
function renderSNIRows(){const box=document.querySelector('#candidateResults');if(!box)return;const base=(state.settings?.realityCandidates||[]).map(x=>({host:x.host,port:443,ok:null,message:'未测试'}));const map=new Map(sniResults.map(x=>[x.host+':'+x.port,x]));const rows=base.map(x=>map.get(x.host+':'+x.port)||x);rows.sort((a,b)=>{if(a.ok===b.ok)return(a.latencyMs||999999)-(b.latencyMs||999999);return a.ok===true?-1:b.ok===true?1:0});box.innerHTML=rows.map(x=>`<div class="candidate-row"><b title="${esc(x.host)}">${esc(x.host)}</b><span class="status ${x.ok===true?'ok':x.ok===false?'fail':''}">[${x.ok===true?'可用':x.ok===false?'不可用':'待测'}]</span><span class="latency">${x.ok===true?x.latencyMs+' ms':'--'}</span><button type="button" class="use" onclick="useSNI('${esc(x.host)}')">填入</button></div>`).join('')||'<div class="test-line">没有配置候选域名。</div>';const c=document.querySelector('#customSNIResult');if(c&&customSNIResult)c.innerHTML=`<div class="test-line ${customSNIResult.ok?'ok':'fail'}">${esc(customSNIResult.message)}${customSNIResult.ok?' · '+customSNIResult.latencyMs+' ms · '+esc(customSNIResult.tlsVersion):''}</div>`}
async function testCustomSNI(){const host=document.querySelector('#handshakeServer')?.value.trim(),port=443;if(!host){toast('请先填写伪装域名');return}try{customSNIResult=await api('/api/reality/test',{method:'POST',body:JSON.stringify({host,port})});renderSNIRows();if(customSNIResult.ok)useSNI(customSNIResult.host,customSNIResult.port)}catch(e){toast(e.message)}}async function testAllSNI(){const box=document.querySelector('#candidateResults');if(box)box.innerHTML='<div class="test-line">正在从 VPS 批量测试候选域名，请稍候…</div>';try{sniResults=await api('/api/reality/test-all',{method:'POST',body:'{}'});renderSNIRows()}catch(e){toast(e.message);renderSNIRows()}}function useSNI(host){const h=document.querySelector('#handshakeServer'),s=document.querySelector('#sni');if(h){h.value=host;s.value=host;toast('已填入 '+host)}}
async function toggleInbound(id){try{await api('/api/inbounds/'+id+'/toggle',{method:'POST'});await load();toast('入站状态已切换')}catch(e){toast(e.message)}}async function deleteInbound(id){if(!confirm('删除此入站？绑定的客户端将不再获得该节点。'))return;try{await api('/api/inbounds/'+id,{method:'DELETE'});await load();toast('入站已删除，相关订阅会自动更新')}catch(e){toast(e.message)}}function editInbound(id){inboundModal((state.inbounds||[]).find(x=>x.id===id))}
function clientState(c){const today=new Date().toISOString().slice(0,10),expired=Boolean(c.expiresAt&&c.expiresAt<today),totalExhausted=Boolean(c.totalLimitBytes&&c.usedBytes>=c.totalLimitBytes),monthlyExhausted=Boolean(c.monthlyLimitBytes&&c.monthlyUsedBytes>=c.monthlyLimitBytes);return c.paused||expired||totalExhausted||monthlyExhausted?'idle':'green'}function viewClients(){document.querySelector('#view').innerHTML=`<div class="client-page"><div class="client-intro"><div><h2>客户端</h2><p class="sub">管理入站绑定、流量、期限和订阅。</p></div><button class="primary add-client" onclick="clientModal()">＋ 新增</button></div><div class="client-list">${(state.clients||[]).map(c=>`<article class="card client-card" onclick="clientDetail('${c.id}')"><div class="client-card-head"><span class="card-status-dot ${clientState(c)}" title="${clientState(c)==='green'?'正常可用':'已暂停、到期或流量用尽'}"></span><b class="client-card-name">${esc(c.username)}</b><div class="client-card-meta"><div class="badges"><span class="badge blue">${c.inboundIds.length} 个入站</span>${c.expiresAt?`<span class="badge">到期 ${esc(c.expiresAt)}</span>`:'<span class="badge">长期有效</span>'}</div></div></div><div class="client-card-body"><div class="client-flow"><div><span>总流量</span><b>${bytes(c.usedBytes)} / ${c.totalLimitBytes?bytes(c.totalLimitBytes):'不限'}</b></div><div><span>月流量</span><b>${bytes(c.monthlyUsedBytes)} / ${c.monthlyLimitBytes?bytes(c.monthlyLimitBytes):'不限'}</b></div></div><div class="client-card-actions" onclick="event.stopPropagation()"><button class="alt" onclick="clientDetail('${c.id}')">详情</button><button class="alt" onclick="openSubscription('${c.username}')">订阅</button><button class="alt" onclick="clientModal((state.clients||[]).find(x=>x.id==='${c.id}'))">编辑</button><button class="danger" onclick="clientAction('${c.id}','delete')">删除</button></div></div></article>`).join('')||'<section class="card section"><h2>尚无客户端</h2><p class="sub">请先创建至少一个入站，再添加客户端并生成订阅地址。</p></section>'}</div></div>`}

function clientDetail(id){const c=(state.clients||[]).find(x=>x.id===id);if(!c)return;const link=(dash.subscriptionBaseURL||'')+'/'+encodeURIComponent(c.username);openModal(`<h2>${esc(c.username)}</h2><p class="sub">${esc(c.note||'客户端详情')}</p><div class="detail-grid"><div><span>绑定入站</span><b>${c.inboundIds.length} 个</b></div><div><span>状态</span><b class="${c.paused?'red':'green'}">${c.paused?'已暂停':'正常'}</b></div><div><span>累计流量</span><b>${bytes(c.usedBytes)} / ${c.totalLimitBytes?bytes(c.totalLimitBytes):'不限'}</b></div><div><span>累计上传 / 下载</span><b>↑ ${bytes(c.uploadBytes)} · ↓ ${bytes(c.downloadBytes)}</b></div><div><span>本月流量</span><b>${bytes(c.monthlyUsedBytes)} / ${c.monthlyLimitBytes?bytes(c.monthlyLimitBytes):'不限'}</b></div><div><span>有效期</span><b>${esc(c.expiresAt||'不限')}</b></div><div><span>在线 IP 限制</span><b>${c.maxOnlineIps||'不限'}</b></div></div><div class="subscription" id="subLink">${esc(link)}</div><div class="item-actions" style="margin-top:14px"><button class="alt" onclick="copySub()">复制订阅</button><button class="alt" onclick="openSubscription('${c.username}')">查看订阅</button><button class="alt" onclick="clientAction('${c.id}','${c.paused?'resume':'pause'}')">${c.paused?'恢复':'暂停'}</button><button class="alt" onclick="clientAction('${c.id}','reset')">重置流量</button><button class="danger" onclick="clientAction('${c.id}','delete')">删除</button></div><div class="dialog-actions"><button class="alt" onclick="closeModal()">关闭</button></div>`)}function openSubscription(username){const link=(dash.subscriptionBaseURL||'')+'/'+encodeURIComponent(username);window.open(link,'_blank','noopener')}async function copySub(){try{await navigator.clipboard.writeText(document.querySelector('#subLink').textContent);toast('订阅地址已复制')}catch{toast('请手动复制订阅地址')}}async function clientAction(id,action){if(action==='delete'&&!confirm('删除此客户端？其订阅将立即失效。'))return;try{await api('/api/clients/'+id+'/'+action,{method:'POST'});closeModal();await load();toast(({pause:'客户端已暂停',resume:'客户端已恢复',reset:'流量已重置',delete:'客户端已删除'})[action]||'操作完成')}catch(e){toast(e.message)}}
function viewSettings(){const cert=dash.certificate||{},services=dash.services||[],certSummary=cert.valid?(cert.expiresAt?'到期 '+cert.expiresAt+(Number.isFinite(cert.days)?' · 剩余 '+cert.days+' 天':''):(Number.isFinite(cert.days)?'剩余 '+cert.days+' 天':'已通过校验')):(cert.expiresAt?'到期 '+cert.expiresAt+' · '+(cert.message||'证书异常'):(cert.message||cert.detail||'证书状态暂不可读'));document.querySelector('#view').innerHTML=`<div class="page-head"><div><h2>设置</h2><p class="sub">维护订阅、候选伪装域名、证书与配置。</p></div></div><div class="list"><section class="card section maintenance-card"><div class="section-head"><h2>维护与更新</h2><div class="item-actions"><button class="maintenance-update" type="button" onclick="updatePanel()">开始更新</button><button class="alt maintenance-log" type="button" onclick="showLogs('update','更新日志')">日志</button></div></div><p id="updateStatus" class="sub maintenance-note">更新会保留现有用户、节点、证书和配置；面板会显示进度，失败时可直接查看更新日志。</p><div class="maintenance-list">${services.map(s=>`<div class="maintenance-item"><div class="maintenance-state"><span>${esc(s.name)}</span><b class="service-state ${s.running?'live':'alert'}"><i></i>${s.running?'正常':'异常'}</b></div><div class="item-actions"><button class="alt" type="button" onclick="serviceControl('${s.id}','restart')">重启</button><button class="alt" type="button" onclick="showLogs('${s.id}','${esc(s.name)} 日志')">日志</button></div></div>`).join('')}<div class="maintenance-item"><div class="maintenance-state"><span>证书</span><b class="service-state ${cert.valid?'live':'alert'}"><i></i>${cert.valid?'有效':'异常'}</b><small>${esc(certSummary)}</small></div><div class="item-actions"><button class="alt" type="button" onclick="renewCertificate()">续签</button><button class="alt" type="button" onclick="showLogs('certificate','证书续签日志')">日志</button></div></div></div></section><section class="card section"><h2>面板与订阅</h2><form id="settings" class="fields settings-form" style="margin-top:16px"><label class="settings-short">面板名称<input name="panelName" value="${esc(state.settings?.panelName||'KotaUI')}"></label><label class="settings-short">订阅路径 <span class="sub">创建后客户端订阅自动更新</span><input disabled value="${esc(state.settings?.subscriptionPath||'/kota-sub')}"></label><label class="full reality-candidates-field">REALITY 候选伪装域名 <span class="sub">每行一个域名；系统默认使用 HTTPS 443，并可在创建 REALITY 时批量测试。</span><textarea name="candidates" rows="10">${(state.settings?.realityCandidates||[]).map(c=>c.host).join('\n')}</textarea></label><label class="full"><input type="checkbox" name="titleEnabled" style="width:auto;margin:0 6px 0 0" ${state.settings?.titleEnabled?'checked':''}> 订阅状态页显示标题信息</label><div class="full"><button class="primary">保存设置</button> <button type="button" class="alt" onclick="validateConfig()">校验 sing-box 配置</button></div></form><pre id="configResult" class="sub"></pre></section></div>`;document.querySelector('#settings').onsubmit=saveSettings}async function saveSettings(e){e.preventDefault();try{const f=new FormData(e.target),rows=String(f.get('candidates')||'').trim().split(/\n+/).filter(Boolean).map(x=>{return{host:x.trim(),port:443}});await api('/api/settings',{method:'PUT',body:JSON.stringify({panelName:f.get('panelName'),titleEnabled:f.get('titleEnabled')==='on',realityCandidates:rows})});await load();toast('设置已保存')}catch(err){toast(err.message)}}async function validateConfig(){try{const r=await api('/api/config/validate',{method:'POST'});document.querySelector('#configResult').textContent=r.ok?'配置校验通过':r.output||'配置校验失败'}catch(e){toast(e.message)}}
function openModal(html){closeModal();const el=document.createElement('div');el.id='modal';el.className='modal';el.onclick=e=>{if(e.target===el)closeModal()};el.innerHTML=`<div class="dialog">${html}</div>`;document.body.append(el)}function closeModal(){document.querySelector('#modal')?.remove()}document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(refreshTimer);refreshTimer=0;return}if(tab==='dashboard'){refreshDashboard();scheduleDashboardRefresh()}});window.go=go;window.toggleDrawer=toggleDrawer;window.closeDrawer=closeDrawer;window.closeModal=closeModal;window.inboundModal=inboundModal;window.editInbound=editInbound;window.toggleInbound=toggleInbound;window.deleteInbound=deleteInbound;window.testCustomSNI=testCustomSNI;window.testAllSNI=testAllSNI;window.useSNI=useSNI;window.clientModal=clientModal;window.clientDetail=clientDetail;window.clientAction=clientAction;window.copySub=copySub;window.openSubscription=openSubscription;window.validateConfig=validateConfig;window.updatePanel=updatePanel;window.renewCertificate=renewCertificate;window.showLogs=showLogs;window.serviceControl=serviceControl;load();
function login(){clearInterval(refreshTimer);root.innerHTML=`<main class="login"><form class="login-card" id="login">${brand()}<p class="sub">使用安装时设置的管理员账号登录。</p><label>账号<input name="username" required autocomplete="username" placeholder="管理员账号"></label><label>密码<input name="password" required type="password" autocomplete="current-password" placeholder="管理员密码"></label><button>进入控制台</button><p class="sub" style="margin:18px 0 0">仅供学习自用，请妥善保管密码。</p></form></main>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(x){toast(x.message)}}}
</script></body></html>
