<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KotaUI</title><style>
:root{--bg:#f3f6fb;--panel:#fff;--ink:#14213d;--muted:#718096;--blue:#315efb;--blue2:#eaf0ff;--line:#e7ebf2;--good:#0c9f75;--bad:#e5484d;--shadow:0 14px 35px rgba(33,52,94,.07)}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:#fff;cursor:pointer;font-weight:650;transition:.2s}button:hover{filter:brightness(.96);transform:translateY(-1px)}button.alt{background:var(--blue2);color:#274bb5}button.danger{background:#fff0f0;color:#c43c45}.shell{display:flex;min-height:100vh}.side{width:236px;background:linear-gradient(180deg,#fff 0%,#f9fbff 100%);border-right:1px solid var(--line);padding:28px 16px;position:fixed;inset:0 auto 0 0;z-index:2}.brandline{display:flex;align-items:center;gap:10px;padding:0 8px 4px}.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#315efb,#6c8cff);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(49,94,251,.25)}.brand-mark svg{width:22px;height:22px}.brand{font-size:21px;letter-spacing:-.5px;font-weight:850}.sub{font-size:12px;color:var(--muted)}.side>.sub{padding:4px 10px 22px}.nav{width:100%;text-align:left;background:transparent;color:#4b5870;margin:3px 0;padding:11px 13px}.nav.on{background:var(--blue2);color:#274bb5}.nav-icon{display:inline-grid;width:23px;vertical-align:middle;margin-right:5px;place-items:center}.main{margin-left:236px;padding:34px;max-width:1380px;width:100%}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.head h1{font-size:30px;letter-spacing:-1px;margin:0 0 4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.metric{position:relative;overflow:hidden}.metric:after{content:"";position:absolute;right:-20px;bottom:-25px;width:90px;height:90px;border-radius:50%;background:var(--blue2)}.metric .label{position:relative;z-index:1}.label{color:var(--muted);font-size:13px}.num{font-weight:800;font-size:24px;margin-top:8px;letter-spacing:-.4px;position:relative;z-index:1}.green{color:var(--good)}.red{color:var(--bad)}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px}.table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:650;background:#fafbfe}.table tr:last-child td{border-bottom:0}.hidden{display:none}.modal{position:fixed;inset:0;background:#17255466;display:grid;place-items:center;padding:20px;z-index:10}.dialog{background:#fff;border-radius:20px;padding:26px;width:min(680px,100%);box-shadow:0 24px 60px #17255433}.dialog h1{margin-top:0}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;color:#475467;font-weight:650;margin:6px 0}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d8dfeb;border-radius:10px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#7c9cff;box-shadow:0 0 0 3px #315efb18}.row{display:flex;gap:8px;align-items:center}.row input{width:auto}.notice{padding:15px 17px;border-radius:14px;background:linear-gradient(135deg,#edf4ff,#f4f7ff);color:#31549f;margin-top:18px;border:1px solid #dce7ff}.dashboard-title{display:flex;align-items:center;gap:9px}.dashboard-title .mini-mark{width:12px;height:12px;border-radius:4px;background:var(--blue);box-shadow:0 0 0 5px #315efb16}.login{display:grid;place-items:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 15% 10%,#dce8ff 0,transparent 32%),radial-gradient(circle at 90% 90%,#e7efff 0,transparent 30%),var(--bg)}.login .dialog{width:410px;padding:34px}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.login-brand .brand-mark{width:48px;height:48px;border-radius:16px}.login-brand h1{margin:0;font-size:27px}.login button{width:100%;margin-top:7px}.actions{display:flex;gap:7px;flex-wrap:wrap}.foot{position:absolute;bottom:22px;color:var(--muted);font-size:12px;padding:0 10px;line-height:1.7}.foot strong{color:#315efb}@media(max-width:800px){.side{position:static;width:100%;height:auto;display:flex;gap:4px;align-items:center;overflow:auto;padding:16px 12px}.side .sub,.foot{display:none}.brandline{padding-right:12px;flex-shrink:0}.side>.sub{display:none}.shell{display:block}.main{margin:0;padding:22px 18px}.head h1{font-size:27px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:17px;border-radius:16px}.fields{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:480px){.side{flex-wrap:wrap}.brandline{width:100%;padding-bottom:5px}.nav{width:auto;flex:1;padding:9px 8px;font-size:13px;text-align:center}.nav-icon{display:none}.grid{grid-template-columns:1fr 1fr}.num{font-size:20px}.login .dialog{padding:26px 21px}}
</style></head><body><div id="app"></div><script>
const root=document.querySelector('#app');let state=null,overview=null,tab='overview';const api=async(u,o={})=>{const r=await fetch(u,{headers:{'content-type':'application/json'},...o});if(!r.ok)throw new Error(await r.text());return r.headers.get('content-type')?.includes('json')?r.json():r.text()};const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const bytes=n=>n?`${(n/1073741824).toFixed(1)} GB`:'0 B';const cap=n=>n?bytes(n):'不限';
async function load(){try{state=await api('/api/state');overview=await api('/api/overview');render()}catch{login()}}
function login(){const mark='<div class=brand-mark aria-hidden=true><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16.5 4.5 19 4 15l-1.5-3L4 8l3-2.5L12 7l5-1.5L20 8l1.5 4-1.5 3 .5 4-2.5-2.5-3 1.5-3-1.5-3 1.5Z"/><path d="M8.5 12h.01M15.5 12h.01M9.5 15.5c1.7 1.2 3.3 1.2 5 0"/></svg></div>';root.innerHTML=`<div class=login><form class=dialog id=login><div class=login-brand>${mark}<div><h1>KotaUI</h1><div class=sub>轻量 sing-box 管理面板</div></div></div><p class=sub>欢迎回来，请使用安装时设置的管理员账号登录。</p><label>账号<input name=username autocomplete=username required placeholder="请输入管理员账号"></label><label>密码<input type=password name=password autocomplete=current-password required placeholder="请输入管理员密码"></label><p><button>进入控制台</button></p><div class=notice>仅供学习自用，请妥善保管管理员密码。</div></form></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});load()}catch(x){alert(x.message)}}}
function nav(){const mark='<div class=brand-mark aria-hidden=true><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16.5 4.5 19 4 15l-1.5-3L4 8l3-2.5L12 7l5-1.5L20 8l1.5 4-1.5 3 .5 4-2.5-2.5-3 1.5-3-1.5-3 1.5Z"/><path d="M8.5 12h.01M15.5 12h.01M9.5 15.5c1.7 1.2 3.3 1.2 5 0"/></svg></div>';const icons=['⌂','◇','♙','⚙'];return `<aside class=side><div class=brandline>${mark}<div class=brand>KotaUI</div></div><div class=sub>轻量 sing-box 管理面板</div>${[['overview','概览'],['inbounds','入站'],['clients','客户端'],['settings','设置']].map((x,i)=>`<button class="nav ${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><span class=nav-icon>${icons[i]}</span>${x[1]}</button>`).join('')}<div class=foot><strong>KotaUI</strong><br>作者那么羡慕你<br>仅供学习自用，请勿随意传播。</div></aside>`}
function render(){root.innerHTML=`<div class=shell>${nav()}<main class=main><div class=head><div><div class=dashboard-title><span class=mini-mark></span><h1>${{overview:'仪表盘',inbounds:'入站',clients:'客户端',settings:'设置'}[tab]}</h1></div><span class=sub>${tab==='overview'?'服务器与节点运行状态':tab==='inbounds'?'管理 VLESS + REALITY、Hysteria 2 与 Shadowsocks 2022':tab==='clients'?'统一控制订阅、流量、有效期与在线限制':'产品设置与安全操作'}</span></div><div class=actions><button class=alt onclick="load()">刷新数据</button></div></div><section id=view></section></main></div>`;({overview:viewOverview,inbounds:viewInbounds,clients:viewClients,settings:viewSettings})[tab]()}function go(v){tab=v;render()}
function viewOverview(){const m=overview.metrics;const totalUsed=state.clients.reduce((a,c)=>a+c.usedBytes,0);const monthUsed=state.clients.reduce((a,c)=>a+c.monthlyUsedBytes,0);document.querySelector('#view').innerHTML=`<div class=grid><div class="card metric"><div class=label>面板与核心</div><div class="num green"><span class=status-dot></span>运行中</div><div class=sub>${overview.inboundCount} 个入站 · ${overview.activeClients} 个可用用户</div></div><div class="card metric"><div class=label>CPU / 负载</div><div class=num>${m.cpuCount} 核</div><div class=sub>负载 ${m.load.map(x=>x.toFixed(2)).join(' / ')}</div></div><div class="card metric"><div class=label>内存占用</div><div class=num>${bytes(m.memoryTotal-m.memoryFree)}</div><div class=sub>总计 ${bytes(m.memoryTotal)} · 可用 ${bytes(m.memoryFree)}</div></div><div class="card metric"><div class=label>活跃用户</div><div class=num>${overview.activeClients}</div><div class=sub>共 ${state.clients.length} 个客户端</div></div></div><div class=grid><div class=card style="grid-column:span 2"><h3>流量概览</h3><p class=sub>所有客户端累计使用</p><p class=num>${bytes(totalUsed)}</p><p class=sub>本月使用 <b>${bytes(monthUsed)}</b></p></div><div class=card style="grid-column:span 2"><h3>证书与版本</h3><p class=sub>当前面板地址</p><p><b>${esc(overview.panelURL)}</b></p><p>证书：<b class="${overview.certificatePresent?'green':'red'}">${overview.certificatePresent?'已加载':'未找到'}</b> <span class=sub>· KotaUI ${esc(overview.version)}</span></p></div></div><div class=notice><b>KotaUI</b> · 作者那么羡慕你，仅供学习自用，请勿随意传播。</div>`}
function viewInbounds(){document.querySelector('#view').innerHTML=`<p><button onclick="inboundModal()">新增入站</button></p><table class=table><thead><tr><th>名称</th><th>协议</th><th>端口</th><th>网络</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.inbounds.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.type)}</td><td>${i.port}</td><td>${esc(i.network||'UDP')}</td><td class=green>● 启用</td><td><button class=danger onclick="removeInbound('${i.id}')">删除</button></td></tr>`).join('')||'<tr><td colspan=6>尚未创建入站。</td></tr>'}</tbody></table>`}
function viewClients(){document.querySelector('#view').innerHTML=`<p><button onclick="clientModal()">新增客户端</button></p><table class=table><thead><tr><th>用户</th><th>入站</th><th>总流量</th><th>本月</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.clients.map(c=>`<tr><td><b>${esc(c.username)}</b><br><span class=sub>${esc(c.note)}</span></td><td>${c.inboundIds.length}</td><td>${bytes(c.usedBytes)} / ${cap(c.totalLimitBytes)}</td><td>${bytes(c.monthlyUsedBytes)} / ${cap(c.monthlyLimitBytes)}</td><td>${esc(c.expiresAt||'不限')}</td><td class="${c.paused?'red':'green'}">● ${c.paused?'暂停':'正常'}</td><td class=actions><button class=alt onclick="sub('${c.username}')">订阅</button><button class=alt onclick="clientAction('${c.id}','${c.paused?'resume':'pause'}')">${c.paused?'恢复':'暂停'}</button><button class=alt onclick="clientAction('${c.id}','reset')">重置</button><button class=danger onclick="clientAction('${c.id}','delete')">删除</button></td></tr>`).join('')||'<tr><td colspan=7>尚未创建客户端。</td></tr>'}</tbody></table>`}
function viewSettings(){document.querySelector('#view').innerHTML=`<div class=card><h3>产品设置</h3><form id=settings class=fields><label class=full>面板名称<input name=panelName value="${esc(state.settings.panelName)}"></label><label class="row full"><input type=checkbox name=titleEnabled ${state.settings.titleEnabled?'checked':''}> 订阅页面显示标题信息</label><label class=full>REALITY 候选目标（每行：域名:端口）<textarea name=candidates rows=5 style="width:100%">${state.settings.realityCandidates.map(x=>x.host+':'+x.port).join('\n')}</textarea></label><div><button>保存设置</button></div><div><button type=button class=alt onclick="validate()">校验 sing-box 配置</button></div></form><pre id=result></pre></div>`;document.querySelector('#settings').onsubmit=saveSettings}
function modal(title,content,submit){const e=document.createElement('div');e.className='modal';e.innerHTML=`<form class=dialog id=modalForm><h2>${title}</h2>${content}<p class=actions><button class=alt type=button onclick="this.closest('.modal').remove()">取消</button><button>保存</button></p></form>`;document.body.append(e);e.querySelector('form').onsubmit=async x=>{x.preventDefault();try{await submit(new FormData(x.target));e.remove();await load()}catch(err){alert(err.message)}}}
function inboundModal(){modal('新增入站',`<div class=fields><label>名称<input name=name required placeholder="例如 HK-REALITY"></label><label>协议<select name=type id=proto onchange="protoFields()"><option value=reality>VLESS + REALITY</option><option value=hysteria2>Hysteria 2</option><option value=shadowsocks2022>Shadowsocks 2022</option></select></label><label>端口<input name=port type=number value=${Math.floor(20000+Math.random()*35000)}></label><label>监听地址<input name=listen value=0.0.0.0></label><div class="full" id=protoFields></div></div>`,async f=>{const x=Object.fromEntries(f);x.port=Number(x.port);x.handshakePort=Number(x.handshakePort||443);x.upMbps=Number(x.upMbps||0);x.downMbps=Number(x.downMbps||0);await api('/api/inbounds',{method:'POST',body:JSON.stringify(x)})});protoFields()}
function protoFields(){const type=document.querySelector('#proto').value;const host=document.querySelector('#protoFields');host.innerHTML=type==='reality'?`<div class=fields><label>REALITY 目标<input name=handshakeServer value="www.cloudflare.com"></label><label>握手端口<input name=handshakePort type=number value=443></label><label>私钥<input name=privateKey required></label><label>公钥<input name=publicKey required></label><label>short_id<input name=shortId></label><label>SNI<input name=sni value="www.cloudflare.com" required></label></div>`:type==='hysteria2'?`<div class=fields><label>上行 Mbps<input name=upMbps type=number value=50></label><label>下行 Mbps<input name=downMbps type=number value=200></label><label>TLS server_name<input name=sni value="${esc(state.settings.domain)}" required></label><label>混淆密码（可选）<input name=obfsPassword></label></div>`:`<div class=notice>固定算法：2022-blake3-aes-256-gcm；服务端密钥将自动生成并安全保存。</div>`}
function clientModal(){if(!state.inbounds.length){alert('请先创建入站');return}modal('新增客户端',`<div class=fields><label>用户名<input name=username pattern="[A-Za-z0-9_-]{3,32}" required></label><label>管理员备注<input name=note placeholder="可输入中文备注"></label><label class=full>选择入站<br>${state.inbounds.map(i=>`<span class=row><input type=checkbox name=inbound value=${i.id} checked>${esc(i.name)} · ${esc(i.type)}</span>`).join('')}</label><label>总流量上限（GiB，0 为不限）<input name=total type=number value=0></label><label>自然月流量（GiB，0 为不限）<input name=monthly type=number value=0></label><label>有效期（留空不限）<input name=expiresAt type=date></label><label>同时在线 IP 数（0 为不限）<input name=maxOnlineIps type=number value=0></label></div>`,async f=>{const x=Object.fromEntries(f);x.inboundIds=f.getAll('inbound');x.totalLimitBytes=Math.round(Number(x.total||0)*1073741824);x.monthlyLimitBytes=Math.round(Number(x.monthly||0)*1073741824);x.maxOnlineIps=Number(x.maxOnlineIps||0);await api('/api/clients',{method:'POST',body:JSON.stringify(x)})})}
async function removeInbound(id){if(confirm('确定删除此入站？')){await api('/api/inbounds/'+id,{method:'DELETE'});load()}}async function clientAction(id,a){if(['delete','reset'].includes(a)&&!confirm('确定执行该操作？'))return;await api('/api/clients/'+id+'/'+a,{method:'POST'});load()}function sub(name){const u=`${state.settings.subscriptionPath}/${name}`;prompt('订阅地址：',location.origin.replace(/:\d+$/,'')+':1109'+u)}async function saveSettings(e){e.preventDefault();const f=new FormData(e.target);const rows=f.get('candidates').trim().split(/\n+/).filter(Boolean).map(x=>{const [host,port]=x.split(':');return{host,port:Number(port||443)}});await api('/api/settings',{method:'PUT',body:JSON.stringify({panelName:f.get('panelName'),titleEnabled:f.get('titleEnabled')==='on',realityCandidates:rows})});load()}async function validate(){const x=await api('/api/config/validate',{method:'POST'});document.querySelector('#result').textContent=x.ok?'配置校验通过':x.output||'配置校验失败'}
window.go=go;window.load=load;window.inboundModal=inboundModal;window.clientModal=clientModal;window.protoFields=protoFields;window.removeInbound=removeInbound;window.clientAction=clientAction;window.sub=sub;window.validate=validate;load();
</script></body></html>
