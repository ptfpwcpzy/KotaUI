<style>
:root{--ink:#15223a;--muted:#78869a;--line:#e4ebf4;--blue:#3671ef;--mint:#12af7f;--violet:#7a61e8;--bg:#f5f8fc;--danger:#de5b65;--warn:#d19524;--idle:#98a5b8;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:246px;padding:22px 14px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;z-index:30}.brand{display:flex;align-items:center;gap:10px;padding:6px 9px 22px}.home-link{border:0;background:transparent;text-align:left;cursor:pointer}.home-link:hover .logo{transform:translateY(-1px);box-shadow:0 13px 28px #4e73de46}.home-link:focus-visible{outline:2px solid #91b2ff;outline-offset:3px;border-radius:16px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;color:#fff;background:linear-gradient(145deg,#3077ef,#7562e7);box-shadow:0 10px 24px #4e73de38;position:relative;overflow:hidden}.logo:after{content:"";position:absolute;inset:5px;border:1px solid #ffffff42;border-radius:10px}.brand b{display:block;font-size:18px;letter-spacing:.1px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:1px}.author{color:#64718a;font-size:11px;margin-top:2px}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;margin:3px 0;background:transparent;border-radius:12px;color:#607089;text-align:left}.nav i{font-style:normal;font-size:19px;width:18px}.nav.on{background:#edf3ff;color:var(--blue);font-weight:700}.foot{margin-top:auto;padding:16px 9px 4px;color:#98a1b0;font-size:11px;line-height:1.7}.main{flex:1;margin-left:246px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column}.page-footer{max-width:1180px;width:100%;margin:26px auto 0;padding:18px 8px 4px;border-top:1px solid var(--line);color:#98a1b0;font-size:11px;line-height:1.7;text-align:center}.page-footer b{color:#748197;font-weight:600}.page-footer span{margin:0 5px;color:#c2cad6}.topbar{display:flex;justify-content:space-between;align-items:center;margin:0 auto 22px;max-width:1180px}.top-title{display:flex;align-items:center;gap:11px}.top-brand{display:flex;align-items:center;gap:10px}.top-brand .logo{width:38px;height:38px}.top-title h1{font-size:28px;line-height:1.1;margin:0}.top-actions{display:flex;align-items:center;gap:8px}.top-actions .alt{font-weight:700}.sub{color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px #def8ef;animation:lamp-live 1.8s ease-in-out infinite}.icon{width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line);color:#243147;font-size:20px}.mobile-menu{display:none}.backdrop{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px #2334510a}.dashboard-grid{max-width:1180px;margin:auto}.gauge-grid{display:grid;grid-template-columns:repeat(4,1fr);padding:22px;gap:12px}.gauge{text-align:center;padding:8px}.dial{--p:0;--c:var(--blue);width:126px;aspect-ratio:1;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#edf0f5 0)}.dial:before{content:"";position:absolute;width:100px;aspect-ratio:1;background:#fff;border-radius:50%}.dial b{z-index:1;font-size:20px}.gauge label{display:block;font-size:15px;font-weight:700}.gauge span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.summary-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.section{padding:20px}.section h2,.page-head h2{margin:0;font-size:20px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.live-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.live-item{border-radius:15px;background:#f7f9fd;padding:14px}.live-item span{display:block;color:var(--muted);font-size:12px}.live-item b{display:block;font-size:20px;margin-top:4px;word-break:break-word;font-variant-numeric:tabular-nums}.health-line{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);color:#64718a;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.health-divider{width:1px;height:14px;background:var(--line);margin:0 2px}.notice{display:flex;gap:10px;border-radius:13px;padding:12px;margin-top:9px;background:#f7f9fd}.notice:first-of-type{margin-top:0}.notice .symbol{font-size:18px}.notice b{display:block;font-size:14px}.notice p{margin:2px 0 0;color:var(--muted);font-size:12px}.notice.warning{background:#fff8e9}.notice.danger{background:#fff0f1}.notice.good{background:#effaf6}.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{padding:13px;border-radius:14px;background:#f8faff}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:4px;font-size:17px}.page-head{max-width:1180px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}.page-head button,.dialog-actions button:last-child,button.primary{padding:11px 15px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700}.list{max-width:1180px;margin:auto;display:grid;gap:12px}.item{padding:18px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}.item b{font-size:17px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:#edf1f7;color:#64718a;font-size:12px}.badge.blue{background:#eaf1ff;color:var(--blue)}.badge.green{background:#e9f8f2;color:#158b68}.badge.green:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px #dff7ed;animation:lamp-live 1.8s ease-in-out infinite}.item-meta{color:var(--muted);font-size:13px;margin-top:7px}.item-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.alt{padding:9px 11px;border-radius:10px;background:#f1f4fa;color:#4c5c77}.danger{padding:9px 11px;border-radius:10px;background:#fff0f1;color:var(--danger)}.modal{position:fixed;z-index:80;inset:0;background:#1720367d;display:flex;align-items:center;justify-content:center;padding:18px}.dialog{width:min(720px,100%);max-height:min(760px,calc(100dvh - 36px));overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 70px #10162955}.dialog h2{margin:0}.protocols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.protocol{padding:11px 7px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#586680;font-size:13px}.protocol.on{color:var(--blue);background:#eef3ff;border-color:#b7caff;font-weight:700}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{display:block;color:#495871;font-weight:600}.fields label.full{grid-column:1/-1}.fields input,.fields textarea{margin-top:6px;width:100%;border:1px solid #dce2ec;border-radius:12px;padding:12px;color:var(--ink);background:#fff}.fields textarea{resize:vertical}.reality-card{grid-column:1/-1;border:1px solid #e1e7f0;border-radius:16px;padding:15px;background:#fbfcff}.reality-card h3{margin:0;font-size:16px}.custom-sni{display:grid;grid-template-columns:1fr 86px auto;gap:8px;margin:12px 0}.custom-sni input{margin:0}.custom-sni button,.test-all{padding:10px 13px;border-radius:10px;background:#edf3ff;color:var(--blue);font-weight:700}.candidate-toolbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}.candidate-results{display:grid;gap:7px}.ipv6-choice{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #e1e7f0;border-radius:14px;background:#fbfcff}.ipv6-choice b{display:block;font-size:14px}.ipv6-choice small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.switch{position:relative;display:block;width:44px;height:25px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.switch span{position:absolute;inset:0;border-radius:99px;background:#cbd3e1;transition:.2s}.switch span:before{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #24304744;transition:.2s}.switch input:checked+span{background:var(--blue)}.switch input:checked+span:before{transform:translateX(19px)}.candidate-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:7px;padding:8px 10px;border:1px solid #e4e9f1;border-radius:10px;background:#fff}.candidate-row b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.candidate-row small{display:none}.candidate-row .status{font-size:11px;padding:2px 6px;border-radius:999px;background:#f0f3f8;color:#6e7c92}.candidate-row .status.ok{background:#e8f8f1;color:#13815e}.candidate-row .status.fail{background:#fff0f1;color:#c24c57}.candidate-row .latency{font-size:12px;color:#586680;white-space:nowrap}.candidate-row .use{padding:6px 8px;border-radius:8px;background:#edf3ff;color:var(--blue);font-size:12px}.test-line{margin-top:8px;padding:10px 11px;border-radius:10px;font-size:12px;background:#f2f5f9;color:#63718a}.test-line.ok{background:#ecfaf4;color:#13815e}.test-line.fail{background:#fff0f1;color:#c24c57}.dialog-actions{position:sticky;bottom:-24px;display:flex;justify-content:flex-end;gap:10px;padding:18px 0 0;margin-top:18px;background:linear-gradient(#ffffffdd,#fff 40%)}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}.detail-grid div{padding:12px;border-radius:12px;background:#f7f9fd}.detail-grid span{display:block;color:var(--muted);font-size:12px}.detail-grid b{display:block;margin-top:3px}.subscription{margin-top:15px;padding:12px;border-radius:12px;background:#f5f7fb;font-size:12px;word-break:break-all;color:#526078}.toast{position:fixed;z-index:120;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 15px;border-radius:12px;background:#1d2940;color:#fff;box-shadow:0 12px 30px #10172945;font-size:14px}.login{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 20%,#e3ecff,transparent 32%),radial-gradient(circle at 85% 80%,#ede6ff,transparent 30%),#f5f7fb}.login-card{width:min(390px,100%);padding:28px;background:#ffffffed;border:1px solid #fff;border-radius:24px;box-shadow:0 24px 65px #2c416128}.login-card label{display:block;margin-top:15px;color:#53617a;font-size:13px}.login-card input{width:100%;border:1px solid #dce3ef;border-radius:12px;padding:12px;margin-top:6px}.login-card button{width:100%;padding:12px;margin-top:20px;background:var(--blue);border-radius:12px;color:#fff;font-weight:700}.green{color:var(--mint)}.red{color:var(--danger)}.service-state{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:700}.service-state i{width:7px;height:7px;border-radius:50%;background:var(--idle);box-shadow:0 0 0 4px #edf1f6;flex:0 0 auto}.service-state.live{color:#168c69}.service-state.live i{background:var(--mint);box-shadow:0 0 0 4px #e0f8ee;animation:lamp-live 1.8s ease-in-out infinite}.service-state.alert{color:#c94f5b}.service-state.alert i{background:var(--danger);box-shadow:0 0 0 4px #fee6e9;animation:lamp-alert 1.05s ease-in-out infinite}.service-state.idle{color:#7b899d}.service-state.idle i{background:var(--idle);box-shadow:0 0 0 4px #eef2f6}@keyframes lamp-live{0%,100%{opacity:.82;transform:scale(.94);box-shadow:0 0 0 4px #e0f8ee}50%{opacity:1;transform:scale(1);box-shadow:0 0 0 7px #d6f7e9}}@keyframes lamp-alert{0%,100%{opacity:.76;transform:scale(.92);box-shadow:0 0 0 4px #fee6e9}50%{opacity:1;transform:scale(1);box-shadow:0 0 0 7px #ffd9de}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
@media(max-width:800px){.sidebar{width:276px;transform:translateX(-105%);transition:transform .2s ease;box-shadow:16px 0 34px #18223d1c}.sidebar.open{transform:translateX(0)}.backdrop.show{display:block;position:fixed;z-index:25;inset:0;background:#17203655}.main{margin:0;padding:18px 14px 40px}.page-footer{margin-top:22px;padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}.mobile-menu{display:inline-grid;place-items:center}.topbar{margin-bottom:16px}.top-title h1{font-size:24px}.gauge-grid{grid-template-columns:repeat(2,1fr);padding:14px;gap:5px}.dial{width:116px}.dial:before{width:91px}.summary-grid{grid-template-columns:1fr;gap:14px}.stat-row{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:1fr}.item-actions{justify-content:flex-start}.page-head{align-items:flex-end}.page-head h2{font-size:23px}.dialog{padding:19px;max-height:calc(100dvh - 22px);border-radius:22px}.fields{grid-template-columns:1fr}.fields label.full{grid-column:auto}.protocols{grid-template-columns:1fr}.custom-sni{grid-template-columns:1fr 74px}.custom-sni button{grid-column:1/-1}.candidate-row{grid-template-columns:minmax(0,1fr) auto auto auto}.candidate-row .use,.candidate-row .latency{grid-column:auto}.detail-grid{grid-template-columns:1fr 1fr}.brand{padding-top:calc(env(safe-area-inset-top) + 4px)}}

<body><div id="root"></div>
<script>
const root=document.querySelector('#root');let state={},dash={},tab='dashboard',drawer=false,refreshTimer=0,lastNetwork=null,netRates={rx:null,tx:null},sniResults=[],customSNIResult=null;
const logo=`<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-label="连接两地"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8.5 12h2.2c1.2 0 1.6-2.8 2.8-2.8h1.1M8.5 12h2.2c1.2 0 1.6 2.8 2.8 2.8h1.1"/><path d="M3.5 7.2v9.6M20.5 7.2v9.6" opacity=".55"/></svg>`;
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function bytes(v){v=Number(v||0);if(!Number.isFinite(v)||v<=0)return '0 B';if(v<1024)return Math.round(v)+' B';if(v<1048576)return(v/1024).toFixed(1)+' KB';if(v<1073741824)return(v/1048576).toFixed(1)+' MB';return(v/1073741824).toFixed(2)+' GB'}function pct(a,b){return b?Math.max(0,Math.min(100,Number(a||0)*100/Number(b))):0}function protocolName(v){return({reality:'VLESS + REALITY',hysteria2:'Hysteria 2',shadowsocks2022:'Shadowsocks 2022'})[v]||v}
async function api(url,opt={}){const r=await fetch(url,{headers:{'content-type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text()||'请求失败');const type=r.headers.get('content-type')||'';return type.includes('json')?r.json():r.text()}
function toast(text){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2800)}
function brand(home=false){return `<div class="brand ${home?'home-link':''}"${home?' role="button" tabindex="0" onclick="go(\'dashboard\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();go(\'dashboard\')}" aria-label="返回仪表盘"':''}><div class="logo">${logo}</div><div><b>KotaUI</b><small>轻量 sing-box 管理面板</small><div class="author">作者 · 那么羡慕你</div></div></div>`}
async function load(){try{[state,dash]=await Promise.all([api('/api/state'),api('/api/dashboard')]);sampleNetwork(dash.metrics);render()}catch{login()}}function sampleNetwork(m){const now=Date.now();if(lastNetwork&&now>lastNetwork.t){const sec=(now-lastNetwork.t)/1000;netRates={rx:Math.max(0,(m.networkRxBytes-lastNetwork.rx)/sec),tx:Math.max(0,(m.networkTxBytes-lastNetwork.tx)/sec)}}lastNetwork={rx:m.networkRxBytes||0,tx:m.networkTxBytes||0,t:now}}
function nav(){const links=[['dashboard','仪表盘','◌'],['inbounds','入站','⌁'],['clients','客户端','◎'],['settings','设置','⚙']];return `<button class="backdrop ${drawer?'show':''}" aria-label="关闭侧栏" onclick="closeDrawer()"></button><aside class="sidebar ${drawer?'open':''}">${brand(true)}${links.map(x=>`<button class="nav ${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[2]}</i>${x[1]}</button>`).join('')}<div class="foot">KotaUI · 作者那么羡慕你<br>仅供学习自用，请勿随意传播。</div></aside>`}
function render(){clearInterval(refreshTimer);const section={dashboard:'仪表盘',inbounds:'入站管理',clients:'客户端管理',settings:'设置'}[tab];root.innerHTML=`<div class="app">${nav()}<main class="main"><header class="topbar"><div class="top-title"><button class="icon mobile-menu" onclick="toggleDrawer()">☰</button><button class="top-brand home-link" type="button" onclick="go('dashboard')" aria-label="返回仪表盘"><div class="logo">${logo}</div><div><h1>KotaUI</h1><div class="sub">${section}</div></div></button></div><div class="top-actions"><button class="icon" onclick="load()">↻</button></div></header><section id="view"></section><footer class="page-footer"><b>作者：那么羡慕你</b><span>·</span>仅供学习自用，请勿随意传播。</footer></main></div>`;({dashboard:viewDashboard,inbounds:viewInbounds,clients:viewClients,settings:viewSettings})[tab]();if(tab==='dashboard')refreshTimer=setInterval(refreshDashboard,5000)}function go(next){tab=next;drawer=false;render()}function toggleDrawer(){drawer=!drawer;render()}function closeDrawer(){if(drawer){drawer=false;render()}}async function refreshDashboard(){if(document.hidden||tab!=='dashboard')return;try{dash=await api('/api/dashboard');sampleNetwork(dash.metrics);viewDashboard()}catch{}}function maintenanceStatus(text){const el=document.querySelector('#updateStatus');if(el)el.textContent=text;toast(text)}async function waitForPanel(attempts=60){maintenanceStatus('更新已完成，正在等待面板重启并恢复…');for(let i=0;i<attempts;i++){await new Promise(resolve=>setTimeout(resolve,500));try{const r=await fetch('/health?ts='+Date.now(),{cache:'no-store'});if(r.ok){maintenanceStatus('更新完成，面板已恢复。');await new Promise(resolve=>setTimeout(resolve,800));location.reload();return true}}catch{}}maintenanceStatus('面板尚未恢复，请查看面板日志或稍后刷新。');return false}async function updatePanel(){if(!confirm('将更新 KotaUI 面板、sing-box 核心和管理脚本，并在完成后重启服务。现有数据与证书不会删除。继续？'))return;maintenanceStatus('正在更新面板、sing-box 核心和管理脚本，请勿手动重启服务…');try{await api('/api/update',{method:'POST',body:'{}'})}catch{}await waitForPanel(240)}async function renewCertificate(){try{const r=await api('/api/certificate/renew',{method:'POST',body:'{}'});toast(r.message||'已开始证书续签检查')}catch(e){toast(e.message)}}async function showLogs(kind,label){openModal(`<h2>${label}</h2><p class="sub">默认显示最近 100 行，可用于定位服务、节点和证书错误。</p><pre id="logContent" class="subscription" style="max-height:45dvh;overflow:auto;white-space:pre-wrap">正在读取…</pre><div class="dialog-actions"><button class="alt" onclick="showLogs('${kind}','${label}')">刷新</button><button class="alt" onclick="navigator.clipboard.writeText(document.querySelector('#logContent').textContent).then(()=>toast('日志已复制'))">复制</button><button class="primary" onclick="closeModal()">关闭</button></div>`);try{const r=await api('/api/logs/'+kind);document.querySelector('#logContent').textContent=r.content||'暂无日志。'}catch(e){document.querySelector('#logContent').textContent='读取失败：'+e.message}}async function serviceControl(service,action){const label=service==='panel'?'面板':'sing-box 核心';if(service==='panel'&&action==='restart'){maintenanceStatus('正在重启面板，等待服务恢复…');try{await api('/api/services/panel/restart',{method:'POST',body:'{}'})}catch{}await waitForPanel(30);return}maintenanceStatus('正在重启'+label+'…');try{const r=await api('/api/services/'+service+'/'+action,{method:'POST',body:'{}'});if(!r.ok)throw new Error(r.message||'服务操作失败');maintenanceStatus(label+'重启完成。');setTimeout(load,900)}catch(e){maintenanceStatus(label+'重启失败：'+e.message)}}
function gauge(name,used,total,detail,color){const p=pct(used,total);return `<div class="gauge"><div class="dial" style="--p:${p};--c:${color}"><b>${p.toFixed(1)}%</b></div><label>${name}</label><span>${detail}</span></div>`}function speed(v){return v===null||!Number.isFinite(v)?'采集中':bytes(v)+'/s'}
function viewDashboard(){const m=dash.metrics||{},mem=(m.memoryTotal||0)-(m.memoryAvailable||0),swap=(m.swapTotal||0)-(m.swapFree||0),disk=(m.diskTotal||0)-(m.diskFree||0),services=dash.services||[],allServicesOK=services.every(x=>x.running)&&dash.certificate?.valid;const line=services.map(x=>`<span class="service-state ${x.running?'live':'alert'}"><i></i>${esc(x.name)}</span>`).join('<span class="health-divider"></span>');const hints=dash.healthHints||[];document.querySelector('#view').innerHTML=`<div class="dashboard-grid"><div class="card gauge-grid">${gauge('CPU · '+(m.cpuCount||0)+' 核',m.cpuPercent,100,(m.cpuPercent||0).toFixed(1)+'%','#3569ee')}${gauge('内存',mem,m.memoryTotal,bytes(mem)+' / '+bytes(m.memoryTotal),'#16a47a')}${gauge('交换空间',swap,m.swapTotal,bytes(swap)+' / '+bytes(m.swapTotal),'#d58a20')}${gauge('存储',disk,m.diskTotal,bytes(disk)+' / '+bytes(m.diskTotal),'#765fe8')}</div><div class="summary-grid"><section class="card section"><div class="section-head"><h2>实时概况</h2><span class="badge green">● 每 5 秒刷新</span></div><div class="live-grid"><div class="live-item"><span>实时下行</span><b>↓ ${speed(netRates.rx)}</b></div><div class="live-item"><span>实时上行</span><b>↑ ${speed(netRates.tx)}</b></div><div class="live-item"><span>代理 TCP 连接</span><b>${m.activeConnections||0}</b></div><div class="live-item"><span>来源 IP（去重）</span><b>${m.activeSourceIPs||0}</b></div></div><div class="health-line"><span class="service-state ${allServicesOK?'live':'alert'}"><i></i>${allServicesOK?'连接正常':'需要维护'}</span><span class="health-divider"></span>${line}<span class="health-divider"></span><span class="service-state ${dash.certificate?.valid?'live':'idle'}"><i></i>证书 ${dash.certificate?.valid?'有效':'待检查'}</span></div></section><section class="card section"><div class="section-head"><h2>待处理事项</h2><button class="alt" onclick="go('settings')">维护</button></div>${hints.length?hints.slice(0,3).map(h=>`<button class="notice ${esc(h.level)}" onclick="go('${esc(h.target)}')"><span class="symbol">${h.level==='danger'?'!':'●'}</span><span><b>${esc(h.title)}</b><p>${esc(h.detail)}</p></span></button>`).join(''):`<div class="notice good"><span class="symbol">●</span><span><b>当前运行正常</b><p>暂无需要处理的事项。</p></span></div>`}</section></div><div class="stat-row"><div class="stat"><span>启用入站</span><b>${state.inbounds?.filter(x=>x.enabled).length||0} / ${dash.inboundCount||0}</b></div><div class="stat"><span>客户端</span><b>${dash.clientCount||0}</b></div><div class="stat"><span>累计流量</span><b>${bytes(dash.totalUsed)}</b></div><div class="stat"><span>本月流量</span><b>${bytes(dash.monthlyUsed)}</b></div></div></div>`}
function viewInbounds(){const list=state.inbounds||[];document.querySelector('#view').innerHTML=`<div class="page-head"><div><h2>入站</h2><p class="sub">维护协议、端口、状态与 REALITY 伪装域名。</p></div><button class="primary" onclick="inboundModal()">＋ 新增入站</button></div><div class="list">${list.map(i=>`<article class="card item"><div><b>${esc(i.name)}</b><div class="badges"><span class="badge blue">${esc(protocolName(i.type))}</span><span class="badge ${i.enabled?'green':''}">${i.enabled?'启用':'已暂停'}</span>${i.type==='reality'?`<span class="badge">${esc(i.handshakeServer)}</span>`:''}</div><div class="item-meta">端口 ${i.port} · ${i.type==='reality'?'SNI '+esc(i.sni):i.type==='hysteria2'?'固定 500 Mbps':'2022'}</div></div><div class="item-actions"><button class="alt" onclick="toggleInbound('${i.id}')">${i.enabled?'暂停':'启用'}</button><button class="alt" onclick="editInbound('${i.id}')">编辑</button><button class="danger" onclick="deleteInbound('${i.id}')">删除</button></div></article>`).join('')||'<section class="card section"><h2>尚未创建入站</h2><p class="sub">点击“新增入站”创建 VLESS + REALITY、Hysteria 2 或 Shadowsocks 2022 入站。</p></section>'}</div>`}
function inboundModal(existing,forcedType){let type=forcedType||existing?.type||'reality';openModal(`<h2>${existing?'编辑入站':'新增入站'}</h2><p class="sub">只填写必要参数；REALITY 密钥和 Short ID 由系统自动生成。</p><div class="protocols">${[['reality','VLESS + REALITY'],['hysteria2','Hysteria 2'],['shadowsocks2022','Shadowsocks 2022']].map(x=>`<button class="protocol ${type===x[0]?'on':''}" type="button" onclick="inboundModal(null,'${x[0]}')">${x[1]}</button>`).join('')}</div><form class="fields" id="inboundForm"><label>名称<input name="name" required value="${esc(existing?.name||'')}" placeholder="例如 HK-REALITY"></label><label>监听端口<input name="port" type="number" required value="${existing?.port||Math.floor(20000+Math.random()*35000)}"></label><div class="ipv6-choice"><div><b>使用 IPv6 分享地址</b><small>服务器有公网 IPv6 时，在订阅节点中优先使用 IPv6 地址</small></div><label class="switch" title="使用 IPv6 分享地址"><input type="checkbox" name="useIPv6" ${existing?.useIPv6?'checked':''}><span></span></label></div><div id="protocolFields" class="full">${protocolFields(type,existing||{})}</div></form><div class="dialog-actions"><button class="alt" onclick="closeModal()">取消</button><button class="primary" onclick="document.querySelector('#inboundForm').requestSubmit()">${existing?'保存修改':'创建入站'}</button></div>`);if(type==='reality')renderSNIRows();document.querySelector('#inboundForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),x=Object.fromEntries(f);x.type=type;x.port=Number(x.port);x.handshakePort=Number(x.handshakePort||443);x.useIPv6=f.get('useIPv6')==='on';x.upMbps=Number(x.upMbps||0);x.downMbps=Number(x.downMbps||0);const created=await api(existing?'/api/inbounds/'+existing.id:'/api/inbounds',{method:existing?'PATCH':'POST',body:JSON.stringify(x)});closeModal();await load();toast(existing?'入站已保存':type==='reality'?'入站已创建，密钥已自动生成':'入站已创建');if(!existing&&created?.id)go('inbounds')}catch(err){toast(err.message)}}}
function protocolFields(type,i={}){if(type==='reality')return realityFields(i);if(type==='hysteria2')return `<div class="reality-card"><h3>Hysteria 2 参数</h3><p class="sub">上下行带宽已固定为 500 Mbps，无需手动设置。</p><label>TLS server_name<input name="sni" required value="${esc(i?.sni||state.settings.domain||'')}"></label><label>混淆密码 <span class="sub">可留空</span><input name="obfsPassword" value="${esc(i?.obfsPassword||'')}"></label></div>`;return '<div class="reality-card">固定算法：2022-blake3-aes-256-gcm。服务端和客户端密钥均由系统自动生成。</div>'}function realityFields(i={}){i=i||{};const host=esc(i.handshakeServer||'');const port=i.handshakePort||443;return `<div class="reality-card"><h3>伪装域名</h3><p class="sub">填入自定义域名后点击测试；也可批量测试候选项，结果会按可用性和延迟排序。</p><div class="custom-sni"><input id="handshakeServer" name="handshakeServer" value="${host}" placeholder="例如 www.cloudflare.com"><input id="handshakePort" name="handshakePort" type="number" value="${port}"><button type="button" onclick="testCustomSNI()">测试</button></div><input id="sni" name="sni" value="${esc(i.sni||i.handshakeServer||'')}" type="hidden"><div id="customSNIResult"></div><div class="candidate-toolbar"><b>候选伪装域名</b><button type="button" class="test-all" onclick="testAllSNI()">全部测试</button></div><div id="candidateResults" class="candidate-results"></div></div><label>密钥与 Short ID <span class="sub">系统自动处理</span><input disabled value="创建或首次设置时自动生成"></label>`}
function renderSNIRows(){const box=document.querySelector('#candidateResults');if(!box)return;const base=(state.settings?.realityCandidates||[]).map(x=>({host:x.host,port:x.port,ok:null,message:'未测试'}));const map=new Map(sniResults.map(x=>[x.host+':'+x.port,x]));const rows=base.map(x=>map.get(x.host+':'+x.port)||x);rows.sort((a,b)=>{if(a.ok===b.ok)return(a.latencyMs||999999)-(b.latencyMs||999999);return a.ok===true?-1:b.ok===true?1:0});box.innerHTML=rows.map(x=>`<div class="candidate-row"><b title="${esc(x.host)}">${esc(x.host)}</b><span class="status ${x.ok===true?'ok':x.ok===false?'fail':''}">[${x.ok===true?'可用':x.ok===false?'不可用':'待测'}]</span><span class="latency">${x.ok===true?x.latencyMs+' ms':'--'}</span><button type="button" class="use" onclick="useSNI('${esc(x.host)}',${x.port||443})">填入</button></div>`).join('')||'<div class="test-line">没有配置候选域名。</div>';const c=document.querySelector('#customSNIResult');if(c&&customSNIResult)c.innerHTML=`<div class="test-line ${customSNIResult.ok?'ok':'fail'}">${esc(customSNIResult.message)}${customSNIResult.ok?' · '+customSNIResult.latencyMs+' ms · '+esc(customSNIResult.tlsVersion):''}</div>`}
async function testCustomSNI(){const host=document.querySelector('#handshakeServer')?.value.trim(),port=Number(document.querySelector('#handshakePort')?.value||443);if(!host){toast('请先填写伪装域名');return}try{customSNIResult=await api('/api/reality/test',{method:'POST',body:JSON.stringify({host,port})});renderSNIRows();if(customSNIResult.ok)useSNI(customSNIResult.host,customSNIResult.port)}catch(e){toast(e.message)}}async function testAllSNI(){const box=document.querySelector('#candidateResults');if(box)box.innerHTML='<div class="test-line">正在从 VPS 批量测试候选域名，请稍候…</div>';try{sniResults=await api('/api/reality/test-all',{method:'POST',body:'{}'});renderSNIRows()}catch(e){toast(e.message);renderSNIRows()}}function useSNI(host,port){const h=document.querySelector('#handshakeServer'),p=document.querySelector('#handshakePort'),s=document.querySelector('#sni');if(h){h.value=host;p.value=port;s.value=host;toast('已填入 '+host)}}
async function toggleInbound(id){try{await api('/api/inbounds/'+id+'/toggle',{method:'POST'});await load();toast('入站状态已切换')}catch(e){toast(e.message)}}async function deleteInbound(id){if(!confirm('删除此入站？绑定的客户端将不再获得该节点。'))return;try{await api('/api/inbounds/'+id,{method:'DELETE'});await load();toast('入站已删除，相关订阅会自动更新')}catch(e){toast(e.message)}}function editInbound(id){inboundModal((state.inbounds||[]).find(x=>x.id===id))}

function clientModal(existing){const enabled=(state.inbounds||[]).filter(x=>x.enabled);if(!enabled.length){toast('请先创建并启用入站');go('inbounds');return}openModal(`<h2>${existing?'编辑客户端':'新增客户端'}</h2><p class="sub">${existing?'修改后保留已有订阅凭据。':'创建后会立即显示订阅地址与使用信息。'}</p><form id="clientForm" class="fields"><label>用户名<input name="username" required pattern="[A-Za-z0-9_-]{3,32}" value="${esc(existing?.username||'')}" placeholder="3–32 位字母、数字、下划线或连字符"></label><label>备注<input name="note" value="${esc(existing?.note||'')}" placeholder="例如 Alice 的手机"></label><label class="full">绑定入站<div class="badges" style="margin-top:7px">${enabled.map(i=>`<label class="badge"><input type="checkbox" name="inbound" value="${i.id}" ${!existing||existing.inboundIds.includes(i.id)?'checked':''} style="width:auto;margin:0 5px 0 0"> ${esc(i.name)} · ${esc(protocolName(i.type))}</label>`).join('')}</div></label><label>总流量上限（GiB，0 为不限）<input name="total" type="number" min="0" value="${existing?((existing.totalLimitBytes||0)/1073741824):0}"></label><label>自然月流量（GiB，0 为不限）<input name="monthly" type="number" min="0" value="${existing?((existing.monthlyLimitBytes||0)/1073741824):0}"></label><label>有效期 <span class="sub">留空不限</span><input name="expiresAt" type="date" value="${esc(existing?.expiresAt||'')}"></label><label>同时在线 IP 数 <span class="sub">0 为不限</span><input name="maxOnlineIps" type="number" min="0" value="${existing?.maxOnlineIps||0}"></label></form><div class="dialog-actions"><button class="alt" onclick="closeModal()">取消</button><button class="primary" onclick="document.querySelector('#clientForm').requestSubmit()">${existing?'保存修改':'创建客户端'}</button></div>`);document.querySelector('#clientForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),x=Object.fromEntries(f);x.inboundIds=f.getAll('inbound');x.totalLimitBytes=Math.round(Number(x.total||0)*1073741824);x.monthlyLimitBytes=Math.round(Number(x.monthly||0)*1073741824);x.maxOnlineIps=Number(x.maxOnlineIps||0);const c=await api(existing?'/api/clients/'+existing.id:'/api/clients',{method:existing?'PATCH':'POST',body:JSON.stringify(x)});closeModal();await load();clientDetail(existing?.id||c.id);toast(existing?'客户端已保存':'客户端已创建')}catch(err){toast(err.message)}}}
function clientDetail(id){const c=(state.clients||[]).find(x=>x.id===id);if(!c)return;const link=(dash.subscriptionBaseURL||'')+'/'+encodeURIComponent(c.username);openModal(`<h2>${esc(c.username)}</h2><p class="sub">${esc(c.note||'客户端详情')}</p><div class="detail-grid"><div><span>绑定入站</span><b>${c.inboundIds.length} 个</b></div><div><span>状态</span><b class="${c.paused?'red':'green'}">${c.paused?'已暂停':'正常'}</b></div><div><span>累计流量</span><b>${bytes(c.usedBytes)} / ${c.totalLimitBytes?bytes(c.totalLimitBytes):'不限'}</b></div><div><span>累计上传 / 下载</span><b>↑ ${bytes(c.uploadBytes)} · ↓ ${bytes(c.downloadBytes)}</b></div><div><span>本月流量</span><b>${bytes(c.monthlyUsedBytes)} / ${c.monthlyLimitBytes?bytes(c.monthlyLimitBytes):'不限'}</b></div><div><span>有效期</span><b>${esc(c.expiresAt||'不限')}</b></div><div><span>在线 IP 限制</span><b>${c.maxOnlineIps||'不限'}</b></div></div><div class="subscription" id="subLink">${esc(link)}</div><div class="item-actions" style="margin-top:14px"><button class="alt" onclick="copySub()">复制订阅</button><button class="alt" onclick="clientAction('${c.id}','${c.paused?'resume':'pause'}')">${c.paused?'恢复':'暂停'}</button><button class="alt" onclick="clientAction('${c.id}','reset')">重置流量</button><button class="danger" onclick="clientAction('${c.id}','delete')">删除</button></div><div class="dialog-actions"><button class="alt" onclick="closeModal()">关闭</button></div>`)}async function copySub(){try{await navigator.clipboard.writeText(document.querySelector('#subLink').textContent);toast('订阅地址已复制')}catch{toast('请手动复制订阅地址')}}async function clientAction(id,action){if(action==='delete'&&!confirm('删除此客户端？其订阅将立即失效。'))return;try{await api('/api/clients/'+id+'/'+action,{method:'POST'});closeModal();await load();toast(({pause:'客户端已暂停',resume:'客户端已恢复',reset:'流量已重置',delete:'客户端已删除'})[action]||'操作完成')}catch(e){toast(e.message)}}
function viewSettings(){const cert=dash.certificate||{},services=dash.services||[];document.querySelector('#view').innerHTML=`<div class="page-head"><div><h2>设置</h2><p class="sub">维护订阅、候选伪装域名、证书与配置。</p></div></div><div class="list"><section class="card section"><div class="section-head"><h2>维护与更新</h2><button class="primary" type="button" onclick="updatePanel()">更新面板、核心与脚本</button></div><p id="updateStatus" class="sub" style="margin:12px 0 0">更新会保留现有用户、节点、证书和配置；更新期间请勿手动重启服务。</p><div class="detail-grid">${services.map(s=>`<div><span>${esc(s.name)}</span><b class="service-state ${s.running?'live':'alert'}"><i></i>${s.running?'连接正常':'未运行'}</b><div class="item-actions" style="margin-top:9px"><button class="alt" type="button" onclick="serviceControl('${s.id}','restart')">重启</button><button class="alt" type="button" onclick="showLogs('${s.id}','${esc(s.name)} 日志')">日志</button></div></div>`).join('')}<div><span>证书状态</span><b class="service-state ${cert.valid?'live':'alert'}"><i></i>${cert.valid?'证书有效':'需要维护'}</b><span>${esc(cert.detail||'证书状态暂不可读')}</span><div class="item-actions" style="margin-top:9px"><button class="alt" type="button" onclick="renewCertificate()">续签检查</button><button class="alt" type="button" onclick="showLogs('certificate','证书续签日志')">日志</button></div></div></div></section><section class="card section"><h2>面板与订阅</h2><form id="settings" class="fields" style="margin-top:16px"><label>面板名称<input name="panelName" value="${esc(state.settings?.panelName||'KotaUI')}"></label><label>订阅路径 <span class="sub">创建后客户端订阅自动更新</span><input disabled value="${esc(state.settings?.subscriptionPath||'/kota-sub')}"></label><label class="full">REALITY 候选伪装域名 <span class="sub">每行：域名:端口；在 REALITY 表单中可批量测试。</span><textarea name="candidates" rows="7">${(state.settings?.realityCandidates||[]).map(c=>c.host+':'+c.port).join('\n')}</textarea></label><label class="full"><input type="checkbox" name="titleEnabled" style="width:auto;margin:0 6px 0 0" ${state.settings?.titleEnabled?'checked':''}> 订阅状态页显示标题信息</label><div class="full"><button class="primary">保存设置</button> <button type="button" class="alt" onclick="validateConfig()">校验 sing-box 配置</button></div></form><pre id="configResult" class="sub"></pre></section></div>`;document.querySelector('#settings').onsubmit=saveSettings}async function saveSettings(e){e.preventDefault();try{const f=new FormData(e.target),rows=String(f.get('candidates')||'').trim().split(/\n+/).filter(Boolean).map(x=>{const [host,port]=x.trim().split(':');return{host,port:Number(port||443)}});await api('/api/settings',{method:'PUT',body:JSON.stringify({panelName:f.get('panelName'),titleEnabled:f.get('titleEnabled')==='on',realityCandidates:rows})});await load();toast('设置已保存')}catch(err){toast(err.message)}}async function validateConfig(){try{const r=await api('/api/config/validate',{method:'POST'});document.querySelector('#configResult').textContent=r.ok?'配置校验通过':r.output||'配置校验失败'}catch(e){toast(e.message)}}
function openModal(html){closeModal();const el=document.createElement('div');el.id='modal';el.className='modal';el.onclick=e=>{if(e.target===el)closeModal()};el.innerHTML=`<div class="dialog">${html}</div>`;document.body.append(el)}function closeModal(){document.querySelector('#modal')?.remove()}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='dashboard')refreshDashboard()});window.go=go;window.toggleDrawer=toggleDrawer;window.closeDrawer=closeDrawer;window.closeModal=closeModal;window.inboundModal=inboundModal;window.editInbound=editInbound;window.toggleInbound=toggleInbound;window.deleteInbound=deleteInbound;window.testCustomSNI=testCustomSNI;window.testAllSNI=testAllSNI;window.useSNI=useSNI;window.clientModal=clientModal;window.clientDetail=clientDetail;window.clientAction=clientAction;window.copySub=copySub;window.validateConfig=validateConfig;window.updatePanel=updatePanel;window.renewCertificate=renewCertificate;window.showLogs=showLogs;window.serviceControl=serviceControl;load();
function login(){clearInterval(refreshTimer);root.innerHTML=`<main class="login"><form class="login-card" id="login">${brand()}<p class="sub">使用安装时设置的管理员账号登录。</p><label>账号<input name="username" required autocomplete="username" placeholder="管理员账号"></label><label>密码<input name="password" required type="password" autocomplete="current-password" placeholder="管理员密码"></label><button>进入控制台</button><p class="sub" style="margin:18px 0 0">仅供学习自用，请妥善保管密码。</p></form></main>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(x){toast(x.message)}}}
</script></body></html>
