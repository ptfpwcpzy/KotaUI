<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KotaUI</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#182230;background:#f6f8fb;line-height:1.45}*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;background:#2669e8;color:#fff;padding:9px 13px;cursor:pointer;transition:.15s}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:not-allowed}.secondary{color:#2559b2;background:#edf3ff}.danger{color:#b42318;background:#fff0ef}.ghost{color:#667085;background:transparent;padding:7px}.muted{color:#667085}.tiny{font-size:12px}.hidden{display:none!important}.login{max-width:410px;margin:12vh auto;padding:24px}.login h1{margin:0;font-size:28px}.notice{padding:12px 14px;background:#f0f5ff;border-left:3px solid #3977e8;color:#3c557c;border-radius:7px;margin:14px 0}.error{background:#fff1f0;border-left-color:#e64d5c;color:#a52835}.app{display:flex;min-height:100vh}.sidebar{width:234px;background:#fff;border-right:1px solid #e8ecf2;padding:20px 13px;display:flex;flex-direction:column;gap:12px;position:fixed;inset:0 auto 0 0}.brand{padding:9px 12px 19px;border-bottom:1px solid #edf0f5}.brand b{font-size:23px;letter-spacing:-.5px}.brand small{display:block;color:#718096;margin-top:2px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{color:#667085;background:transparent;text-align:left;padding:10px 12px;font-weight:650}.nav button.active,.nav button:hover{background:#edf3ff;color:#255fcb}.sidebar-foot{margin-top:auto;padding:12px;font-size:12px;color:#7b8798;border-top:1px solid #edf0f5}.main{width:calc(100% - 234px);margin-left:234px;padding:26px 30px 44px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:21px}.head h1{margin:0;font-size:25px;letter-spacing:-.4px}.head p{margin:4px 0 0;color:#667085}.top-actions{display:flex;gap:8px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid #e7ebf1;border-radius:13px;padding:17px;box-shadow:0 3px 12px rgba(19,37,64,.025)}.metric label{display:block;color:#6f7b8b;font-size:13px}.metric b{font-size:25px;display:block;margin-top:7px;letter-spacing:-.5px}.metric small{color:#7f8a99}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.section{margin-top:15px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section-head h2{font-size:17px;margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{font-size:13px;text-align:left;padding:12px 8px;border-bottom:1px solid #eff2f5;vertical-align:middle}th{color:#788496;font-weight:650;background:#fbfcfe}.empty{padding:38px 14px;color:#7a8798;text-align:center}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:#edf8f1;color:#087b41;padding:4px 8px;font-size:12px;font-weight:700}.badge.red{background:#fff0f0;color:#bf2635}.badge.blue{background:#edf3ff;color:#2862bd}.dot{width:7px;height:7px;background:currentColor;border-radius:50%;display:inline-block}.actions{display:flex;flex-wrap:wrap;gap:6px}.status-ok{color:#0a7a42}.status-stop{color:#a66710}.status-warn{color:#c43342}.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#456078;font-size:12px;word-break:break-all}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid.full>*,.full{grid-column:1/-1}label.field{display:block;color:#536174;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px 11px;color:#1e2938;background:#fff;border:1px solid #d8dfe9;border-radius:9px;outline:none}input:focus,select:focus,textarea:focus{border-color:#6c9df1;box-shadow:0 0 0 3px #dfeaff}textarea{min-height:76px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{border:1px solid #dde4ee;border-radius:8px;padding:8px 10px;color:#435166;font-size:13px}.check input{width:auto;margin-right:6px}.modal{position:fixed;inset:0;background:#19223275;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.dialog{width:min(700px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;padding:22px;box-shadow:0 18px 60px #10182855}.dialog h2{font-size:19px;margin:0 0 5px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.progress{height:7px;border-radius:7px;background:#ebeff5;overflow:hidden}.progress i{display:block;height:100%;background:#4780eb;border-radius:7px}.key-value{display:grid;grid-template-columns:130px 1fr;gap:8px;margin:9px 0}.key-value span:first-child{color:#758195}.monospace{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.toast{position:fixed;right:20px;bottom:20px;z-index:20;max-width:380px;padding:12px 15px;border-radius:10px;background:#163558;color:#fff;box-shadow:0 10px 30px #10213b30}.toast.error{background:#a92b39}.hide-mobile{display:block}@media(max-width:900px){.sidebar{width:65px;padding:13px 8px}.brand{padding:8px 6px 16px;text-align:center}.brand small,.nav button span,.sidebar-foot{display:none}.brand b{font-size:19px}.nav button{text-align:center;padding:11px 5px}.main{margin-left:65px;width:calc(100% - 65px);padding:20px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.hide-mobile{display:none}}@media(max-width:580px){.main{padding:17px 12px}.grid,.form-grid{grid-template-columns:1fr}.head{display:block}.top-actions{margin-top:12px}.metric b{font-size:22px}.login{margin:6vh 13px}.key-value{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<section id="login" class="login card"><h1>KotaUI</h1><p class="muted">请使用安装时设置的管理员账号登录。</p><form id="loginForm"><label class="field">账号</label><input name="username" autocomplete="username" required><label class="field">密码</label><input name="password" type="password" autocomplete="current-password" required><div id="loginError" class="notice error hidden"></div><div class="dialog-foot"><button>登录面板</button></div></form></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><b>KotaUI</b><small>sing-box 管理面板</small></div><nav class="nav"><button data-page="dashboard" class="active">◫ <span>概览</span></button><button data-page="inbounds">◈ <span>入站</span></button><button data-page="clients">◉ <span>客户端</span></button><button data-page="settings">⚙ <span>设置</span></button></nav><div class="sidebar-foot">作者那么羡慕你<br>仅供学习自用，请勿随意传播。</div></aside><main class="main"><header class="head"><div><h1 id="pageTitle">概览</h1><p id="pageSubtitle">服务器与节点运行状态</p></div><div class="top-actions"><button class="secondary" id="syncTraffic">同步流量</button><button class="secondary" id="refresh">刷新</button></div></header><div id="view"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">操作</h2><p id="modalSub" class="muted"></p><form id="modalForm"></form></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];let state=null,dashboard=null,currentPage='dashboard';
const formatBytes=n=>{n=Math.max(0,Number(n||0));const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n>=100||i===0?n.toFixed(0):n.toFixed(1)} ${u[i]}`};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytesFromGiB=v=>Math.round(Math.max(0,Number(v||0))*1024**3);const gib=v=>Number(v||0)?(Number(v)/1024**3).toFixed(2):'';
function toast(message,fail=false){const el=$('#toast');el.textContent=message;el.className=`toast${fail?' error':''}`;setTimeout(()=>el.className='toast hidden',3300)}
async function api(url,opt={}){const options={credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt};const response=await fetch(url,options);let data={};const raw=await response.text();try{data=raw?JSON.parse(raw):{}}catch{data={text:raw}}if(response.status===401){showLogin();throw Error(data.error||'需要重新登录')}if(!response.ok)throw Error(data.error||data.text||'请求失败');return data}
function panelUrl(){const host=state.settings.domain||location.hostname;return `https://${host}:${state.settings.panelPort}${state.settings.panelPath}`}
function subscriptionUrl(client){const host=state.settings.domain||location.hostname;return `https://${host}:${state.settings.subscriptionPort}${state.settings.subscriptionPath}/${encodeURIComponent(client.username)}`}
async function load(){[state,dashboard]=await Promise.all([api('/api/state'),api('/api/dashboard')]);render()}
function status(client){if(client.enabled)return `<span class="status-ok">● ${esc(client.state||'正常')}</span>`;const warn=/到期|用尽/.test(client.state||'');return `<span class="${warn?'status-warn':'status-stop'}">${warn?'!':'■'} ${esc(client.state||'已暂停')}</span>`}
function render(){const names={dashboard:['概览','服务器与节点运行状态'],inbounds:['入站','管理 VLESS + REALITY、Hysteria 2 与 Shadowsocks 2022'],clients:['客户端','统一控制多入站订阅、流量、有效期与在线限制'],settings:['设置','证书、标题信息、更新与运行状态']};$('#pageTitle').textContent=names[currentPage][0];$('#pageSubtitle').textContent=names[currentPage][1];$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));$('#view').innerHTML=({dashboard:dashboardView,inbounds:inboundsView,clients:clientsView,settings:settingsView}[currentPage])();bindPage()}
function dashboardView(){const m=dashboard.metrics,mem=m.memory,disk=m.disk,net=m.network,cert=dashboard.certificate;const pct=(a,b)=>b?Math.min(100,(a/b)*100):0;return `<section class="grid"><div class="card metric"><label>面板与核心</label><b><span class="badge"><i class="dot"></i>运行中</span></b><small>${dashboard.inbounds.enabled} 个启用入站 · ${dashboard.clients.enabled} 个可用用户</small></div><div class="card metric"><label>CPU 使用率</label><b>${m.cpu.usagePercent.toFixed(1)}%</b><small>${m.cpu.cores} 核 · 负载 ${m.load.join(' / ')}</small><div class="progress"><i style="width:${m.cpu.usagePercent}%"></i></div></div><div class="card metric"><label>内存</label><b>${formatBytes(mem.usedBytes)}</b><small>共 ${formatBytes(mem.totalBytes)} · 可用 ${formatBytes(mem.availableBytes)}</small><div class="progress"><i style="width:${pct(mem.usedBytes,mem.totalBytes)}%"></i></div></div><div class="card metric"><label>磁盘</label><b>${formatBytes(disk.usedBytes)}</b><small>共 ${formatBytes(disk.totalBytes)} · 剩余 ${formatBytes(disk.freeBytes)}</small><div class="progress"><i style="width:${pct(disk.usedBytes,disk.totalBytes)}%"></i></div></div></section><section class="split"><div class="card"><div class="section-head"><h2>使用概览</h2><span class="muted tiny">${esc(dashboard.traffic.uptimeLabel)}</span></div><div class="key-value"><span>累计用户流量</span><b>${esc(dashboard.traffic.usedLabel)}</b></div><div class="key-value"><span>本月用户流量</span><b>${formatBytes(dashboard.traffic.monthlyUsedBytes)}</b></div><div class="key-value"><span>实时下行 / 上行</span><b>${formatBytes(net.downloadRateBytes)}/s · ${formatBytes(net.uploadRateBytes)}/s</b></div><div class="key-value"><span>服务器 IP</span><b class="monospace">${esc(m.ip||'未识别')}</b></div></div><div class="card"><div class="section-head"><h2>证书状态</h2><span class="badge ${cert.present?'':'red'}"><i class="dot"></i>${cert.present?'已加载':'未加载'}</span></div><div class="key-value"><span>面板地址</span><b class="path">${esc(panelUrl())}</b></div><div class="key-value"><span>证书到期</span><b>${cert.expiresAt?new Date(cert.expiresAt).toLocaleString('zh-CN'):'未找到证书'}</b></div><div class="key-value"><span>版本</span><b>KotaUI ${esc(state.versions.ui)} · sing-box ${esc(state.versions.singBox)}</b></div></div></section><section class="card section"><div class="notice"><b>KotaUI</b> · 作者那么羡慕你，仅供学习自用，请勿随意传播。</div></section>`}
function inboundsView(){const rows=state.inbounds.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.type==='reality'?'VLESS + REALITY':x.type==='hysteria2'?'Hysteria 2':'Shadowsocks 2022'}</td><td class="monospace">${x.port}</td><td>${x.type==='shadowsocks2022'?'TCP + UDP':x.type==='hysteria2'?'UDP':'TCP'}</td><td><span class="badge ${x.enabled?'':'red'}"><i class="dot"></i>${x.enabled?'启用':'停用'}</span></td><td><button class="danger tiny" data-del-inbound="${x.id}">删除</button></td></tr>`).join('');return `<section class="card"><div class="section-head"><div><h2>入站列表</h2><p class="muted tiny">端口固定随机生成或手工指定；入站只统计流量，不设置用户配额。</p></div><button id="addInbound">新增入站</button></div>${rows?`<div class="table-wrap"><table><thead><tr><th>名称</th><th>协议</th><th>端口</th><th>网络</th><th>状态</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">尚未创建入站。请先新增至少一个入站，再创建客户端。</div>'}</section>`}
function clientsView(){const rows=state.clients.map(c=>`<tr><td><b>${esc(c.username)}</b><br><span class="muted tiny">${esc(c.note||'无备注')}</span></td><td>${c.inbounds.length}</td><td>${formatBytes(c.usedBytes)} / ${c.totalLimitBytes?formatBytes(c.totalLimitBytes):'不限'}</td><td>${formatBytes(c.monthlyUsedBytes)} / ${c.monthlyLimitBytes?formatBytes(c.monthlyLimitBytes):'不限'}</td><td>${c.expiresAt?new Date(c.expiresAt).toLocaleDateString('zh-CN'):'不限'}</td><td>${status(c)}</td><td><div class="actions"><button class="secondary tiny" data-copy-sub="${c.id}">订阅</button><button class="secondary tiny" data-client-action="${c.id}" data-action="${c.enabled?'pause':'resume'}">${c.enabled?'暂停':'启用'}</button><button class="ghost tiny" data-client-action="${c.id}" data-action="reset">重置</button><button class="danger tiny" data-client-action="${c.id}" data-action="delete">删除</button></div></td></tr>`).join('');return `<section class="card"><div class="section-head"><div><h2>客户端</h2><p class="muted tiny">用户名仅允许 3–32 位字母、数字、下划线或连字符；中文仅用作备注。</p></div><button id="addClient" ${state.inbounds.length ? '' : 'disabled'}>新增客户端</button></div>${rows?`<div class="table-wrap"><table><thead><tr><th>用户</th><th>入站</th><th>总流量</th><th>本月</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">尚未创建客户端。${state.inbounds.length ? '' : '请先创建入站。'}</div>`}</section>`}
function settingsView(){const candidates=(state.settings.realityCandidates||[]).map(x=>`${x.host}:${x.port||443}`).join('\n');return `<section class="split"><form class="card" id="settingsForm"><div class="section-head"><h2>展示与订阅</h2></div><label class="field">产品名称</label><input name="panelName" value="${esc(state.settings.panelName)}"><label class="field">订阅标题信息</label><div class="checks"><label class="check"><input type="checkbox" name="titleEnabled" ${state.settings.titleEnabled?'checked':''}>启用标题用量信息</label></div><label class="field">REALITY 内置候选（每行 主机:端口）</label><textarea name="realityCandidates">${esc(candidates)}</textarea><p class="muted tiny">候选会在创建 VLESS + REALITY 入站时提供即时 TLS 检测；可改为完全自定义目标。</p><div class="dialog-foot"><button>保存设置</button></div></form><section class="card"><div class="section-head"><h2>运维操作</h2></div><div class="key-value"><span>订阅端口</span><b>${state.settings.subscriptionPort}</b></div><div class="key-value"><span>订阅路径</span><b class="monospace">${esc(state.settings.subscriptionPath)}/用户名</b></div><div class="key-value"><span>证书路径</span><b class="path">${esc(dashboard.certificate.source||'未加载')}</b></div><div class="actions"><button class="secondary" id="validateConfig">校验 sing-box 配置</button><button class="secondary" id="renewCert">查看续签状态</button><button class="secondary" id="checkUpdates">检查更新</button></div><div id="settingResult" class="notice hidden"></div></section></section>`}
function bindPage(){$('#refresh').onclick=()=>load().catch(showError);$('#syncTraffic').onclick=async()=>{try{await api('/api/traffic/sync',{method:'POST',body:'{}'});toast('已完成流量同步');await load()}catch(e){showError(e)}};if(currentPage==='inbounds'){$('#addInbound').onclick=openInbound;$$('[data-del-inbound]').forEach(b=>b.onclick=async()=>{if(confirm('删除入站会同时从关联客户端移除该入站，是否继续？'))try{await api('/api/inbounds/'+b.dataset.delInbound,{method:'DELETE'});await load();toast('入站已删除')}catch(e){showError(e)}})}if(currentPage==='clients'){$('#addClient')&&($('#addClient').onclick=openClient);$$('[data-client-action]').forEach(b=>b.onclick=()=>clientAction(b.dataset.clientAction,b.dataset.action));$$('[data-copy-sub]').forEach(b=>b.onclick=()=>{const c=state.clients.find(x=>x.id===b.dataset.copySub);navigator.clipboard?.writeText(subscriptionUrl(c));toast(`订阅地址已复制：${subscriptionUrl(c)}`)})}if(currentPage==='settings'){ $('#settingsForm').onsubmit=saveSettings;$('#validateConfig').onclick=validateConfig;$('#renewCert').onclick=renewCert;$('#checkUpdates').onclick=checkUpdates}}
function openModal(title,subtitle,body,onSubmit){$('#modalTitle').textContent=title;$('#modalSub').textContent=subtitle||'';$('#modalForm').innerHTML=body;$('#modal').classList.add('open');$('#modalForm').onsubmit=async e=>{e.preventDefault();try{await onSubmit(new FormData(e.target));closeModal();await load()}catch(err){showError(err)}}}
function closeModal(){$('#modal').classList.remove('open');$('#modalForm').innerHTML=''}
function randomPort(){return Math.floor(20000+Math.random()*35000)}
function inboundFields(type){if(type==='reality')return `<label class="field">REALITY 目标</label><select name="handshakeServer" id="realityTarget"><option value="">选择已检测候选或自定义</option>${(state.settings.realityCandidates||[]).map(x=>`<option value="${esc(x.host)}">${esc(x.host)}:${x.port||443}</option>`).join('')}</select><div class="actions"><button type="button" class="secondary tiny" id="probeReality">检测目标</button><button type="button" class="secondary tiny" id="generateKeys">生成密钥对</button></div><div id="probeResult" class="notice hidden"></div><div class="form-grid"><div><label class="field">握手端口</label><input name="handshakePort" value="443" type="number" min="1" max="65535"></div><div><label class="field">short_id</label><input name="shortId" value="${cryptoRandom(16)}" required></div></div><label class="field">私钥</label><input name="privateKey" required><label class="field">公钥</label><input name="publicKey" required><label class="field">SNI</label><input name="sni" placeholder="默认与目标一致">`;if(type==='hysteria2')return `<div class="form-grid"><div><label class="field">上行 Mbps</label><input name="upMbps" type="number" min="0" value="50"></div><div><label class="field">下行 Mbps</label><input name="downMbps" type="number" min="0" value="200"></div></div><label class="field">TLS server_name</label><input name="tlsServerName" value="${esc(state.settings.domain||'')}" required><label class="field">混淆密码（可选）</label><input name="obfsPassword" placeholder="留空即不启用 salamander 混淆">`;return `<div class="notice">固定算法：<b>2022-blake3-aes-256-gcm</b>；系统会自动生成并安全保存服务端密钥。</div><label class="field">网络</label><select name="network"><option value="tcp,udp">TCP + UDP</option><option value="tcp">仅 TCP</option><option value="udp">仅 UDP</option></select>`}
function cryptoRandom(n){const a=new Uint8Array(Math.ceil(n/2));crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,n)}
function openInbound(){openModal('新增入站','仅展示必要字段；高级凭据由系统生成或安全保存。',`<div class="form-grid"><div><label class="field">名称</label><input name="name" required placeholder="例如 HK-REALITY"></div><div><label class="field">协议</label><select name="type" id="protocol"><option value="reality">VLESS + REALITY</option><option value="hysteria2">Hysteria 2</option><option value="shadowsocks2022">Shadowsocks 2022</option></select></div><div><label class="field">端口</label><input name="port" type="number" min="1024" max="65535" value="${randomPort()}" required></div><div><label class="field">监听地址</label><input name="listen" value="0.0.0.0"></div></div><div id="protocolFields"></div><div class="dialog-foot"><button type="button" class="secondary" id="cancelModal">取消</button><button>保存入站</button></div>`,async form=>{const data=Object.fromEntries(form);data.port=Number(data.port);await api('/api/inbounds',{method:'POST',body:JSON.stringify(data)});toast('入站已创建')});const p=$('#protocol');const draw=()=>{$('#protocolFields').innerHTML=inboundFields(p.value);bindInboundExtras()};p.onchange=draw;draw();$('#cancelModal').onclick=closeModal}
function bindInboundExtras(){const probe=$('#probeReality'),keys=$('#generateKeys');if(probe)probe.onclick=async()=>{const host=$('#realityTarget').value||prompt('请输入要检测的目标域名：','');if(!host)return;const out=$('#probeResult');out.classList.remove('hidden');out.textContent='正在检测 TLS 目标…';try{const x=await api('/api/reality/probe',{method:'POST',body:JSON.stringify({host,port:443})});out.textContent=x.ok?`可用 · ${x.latencyMs} ms · ${x.tlsVersion} · SNI: ${(x.serverNames||[]).join(', ')||host}`:`不可用：${x.error}`;if(x.ok){const select=$('#realityTarget');if(![...select.options].some(option=>option.value===host)){const option=document.createElement('option');option.value=host;option.textContent=`自定义：${host}`;select.append(option)}select.value=host;const s=$('[name=sni]');if(s&&!s.value)s.value=(x.serverNames||[])[0]||host}}catch(e){out.textContent=e.message}};if(keys)keys.onclick=async()=>{try{const x=await api('/api/reality/keypair',{method:'POST',body:'{}'});$('[name=privateKey]').value=x.privateKey;$('[name=publicKey]').value=x.publicKey;toast('已生成 REALITY 密钥对')}catch(e){showError(e)}}}
function openClient(){const choices=state.inbounds.map(x=>`<label class="check"><input type="checkbox" name="inbounds" value="${x.id}" checked> ${esc(x.name)} · ${x.type==='reality'?'REALITY':x.type}</label>`).join('');openModal('新增客户端','创建后将为所选入站生成同一用户名下的独立凭据。',`<div class="form-grid"><div><label class="field">用户名</label><input name="username" pattern="[A-Za-z0-9_-]{3,32}" required></div><div><label class="field">管理员备注</label><input name="note" placeholder="可输入中文备注"></div><div class="full"><label class="field">选择入站</label><div class="checks">${choices}</div></div><div><label class="field">总流量上限（GiB，0 为不限）</label><input name="totalGiB" type="number" min="0" step="0.1" value="0"></div><div><label class="field">自然月流量（GiB，0 为不限）</label><input name="monthlyGiB" type="number" min="0" step="0.1" value="0"></div><div><label class="field">有效期（留空不限）</label><input name="expiresAt" type="date"></div><div><label class="field">同时在线 IP 数（0 为不限）</label><input name="maxOnlineIps" type="number" min="0" value="0"></div></div><div class="dialog-foot"><button type="button" class="secondary" id="cancelModal">取消</button><button>创建客户端</button></div>`,async form=>{const data=Object.fromEntries(form);data.inbounds=[...form.getAll('inbounds')];data.totalLimitBytes=bytesFromGiB(data.totalGiB);data.monthlyLimitBytes=bytesFromGiB(data.monthlyGiB);data.maxOnlineIps=Number(data.maxOnlineIps||0);delete data.totalGiB;delete data.monthlyGiB;await api('/api/clients',{method:'POST',body:JSON.stringify(data)});toast('客户端已创建')});$('#cancelModal').onclick=closeModal}
async function clientAction(id,action){if(action==='delete'&&!confirm('确定删除该客户端？此操作会立即使订阅失效。'))return;if(action==='reset'&&!confirm('确定重置该客户端全部流量计数？'))return;try{await api(`/api/clients/${id}/action`,{method:'POST',body:JSON.stringify({action})});await load();toast('客户端操作已完成')}catch(e){showError(e)}}
async function saveSettings(e){e.preventDefault();const f=new FormData(e.target);const list=String(f.get('realityCandidates')||'').split(/\n+/).map(row=>row.trim()).filter(Boolean).map(row=>{const [host,port]=row.split(':');return{host,port:Number(port||443)}});try{await api('/api/settings',{method:'PUT',body:JSON.stringify({panelName:f.get('panelName'),titleEnabled:f.get('titleEnabled')==='on',realityCandidates:list})});toast('设置已保存');await load()}catch(err){showError(err)}}
async function validateConfig(){try{const x=await api('/api/config/validate',{method:'POST',body:'{}'});showSetting(x.ok?'配置校验通过。':`配置校验失败：${x.error||x.output||'未知错误'}`,!x.ok)}catch(e){showError(e)}}async function renewCert(){try{const x=await api('/api/certificates/renew',{method:'POST',body:'{}'});showSetting(x.certificate.present?`证书已加载，到期时间：${x.certificate.expiresAt||'未读取到'}`:'当前未找到证书。',!x.certificate.present)}catch(e){showError(e)}}async function checkUpdates(){try{const x=await api('/api/updates');showSetting(`当前 KotaUI ${x.current.ui}，sing-box ${x.current.singBox}。更新前会自动备份并校验配置。`)}catch(e){showError(e)}}function showSetting(text,error=false){const e=$('#settingResult');e.textContent=text;e.className=`notice${error?' error':''}`}
function showLogin(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden')}function showError(e){toast(e.message||String(e),true)}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});showApp();await load()}catch(err){const el=$('#loginError');el.textContent=err.message;el.classList.remove('hidden')}};$$('.nav button').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;render()});$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};api('/api/auth/status').then(async x=>{if(!x.required||x.authenticated){showApp();await load()}else showLogin()}).catch(showLogin);
</script>
