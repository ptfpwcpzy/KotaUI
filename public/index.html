<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KotaUI</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px}.top,.section-head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:800}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}.card{background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:18px;box-shadow:0 5px 16px #17203308}.metric{font-size:28px;font-weight:750;margin-top:8px}.section{margin-top:18px}h2{font-size:18px;margin:0}button{border:0;border-radius:9px;padding:9px 13px;background:#2457d6;color:#fff;cursor:pointer}button.secondary{background:#eef2ff;color:#2446a6}button.danger{background:#fee4e2;color:#b42318}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9f8ef;color:#16723a;font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;font-size:14px}th{color:#667085}.empty{color:#667085;padding:22px 0}.modal{position:fixed;inset:0;background:#10182866;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{width:min(560px,calc(100% - 32px));max-height:90vh;overflow:auto;background:#fff;padding:22px;border-radius:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;color:#475467;display:block;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.notice{margin-top:10px;padding:10px;border-radius:8px;background:#fff8e1;color:#8a5a00;font-size:13px}@media(max-width:700px){.shell{padding:16px}.grid,.row{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">KotaUI</div><div class="muted">sing-box 节点管理面板 · 中文浅色界面</div></div><button id="refresh" class="secondary">刷新数据</button></header>
<section class="grid"><div class="card"><div class="muted">服务状态</div><div class="metric" id="health">检查中</div></div><div class="card"><div class="muted">启用入站</div><div class="metric" id="inboundCount">0</div></div><div class="card"><div class="muted">客户端</div><div class="metric" id="clientCount">0</div></div></section>
<section class="card section"><div class="section-head"><h2>入站管理</h2><button id="addInbound">新增入站</button></div><div id="inbounds"></div></section>
<section class="card section"><div class="section-head"><h2>客户端管理</h2><button id="addClient">新增客户端</button></div><div id="clients"></div></section>
<section class="card section"><div class="section-head"><h2>设置与更新</h2><button id="updateBtn">检查并更新全部核心</button></div><div id="versions" class="muted">读取版本中</div><div id="certNotice"></div><div class="notice">更新会同时处理 KotaUI、sing-box 和 Hysteria 2；更新前自动备份，失败时自动回滚。正式环境仍需接入经过校验的发布源。</div></section></main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">新增</h2><form id="form"></form></div></div>
<script>
const $=s=>document.querySelector(s);let state;
async function api(url,opt){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){state=await api('/api/state');const h=await api('/api/health');$('#health').textContent=h.ok?'运行中':'异常';$('#inboundCount').textContent=state.inbounds.filter(x=>x.enabled).length;$('#clientCount').textContent=state.clients.length;$('#versions').textContent=`面板 ${state.versions.ui} · sing-box ${state.versions.singBox} · Hysteria 2 ${state.versions.hysteria2}`;render()}
function render(){const ins=state.inbounds;if(!ins.length)$('#inbounds').innerHTML='<div class="empty">暂无入站。</div>';else $('#inbounds').innerHTML='<table><thead><tr><th>名称</th><th>协议</th><th>端口</th><th>状态</th><th></th></tr></thead><tbody>'+ins.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${x.port}</td><td><span class="pill">${x.enabled?'已启用':'已停用'}</span></td><td><button class="danger" onclick="removeInbound('${x.id}')">删除</button></td></tr>`).join('')+'</tbody></table>';
const cs=state.clients;if(!cs.length)$('#clients').innerHTML='<div class="empty">暂无客户端。</div>';else $('#clients').innerHTML='<table><thead><tr><th>用户名</th><th>备注</th><th>入站数</th><th>订阅</th><th>状态</th></tr></thead><tbody>'+cs.map(x=>`<tr><td><strong>${esc(x.username)}</strong></td><td>${esc(x.note)}</td><td>${x.inbounds.length}</td><td><a href="/kota-sub/${encodeURIComponent(x.username)}" target="_blank">查看订阅</a></td><td><span class="pill">${x.enabled?'启用':'暂停'}</span></td></tr>`).join('')+'</tbody></table>'}
function protocolFields(type){if(type==='reality')return '<label>握手域名</label><input name="handshakeServer" placeholder="www.example.com" required><div class="row"><div><label>握手端口</label><input name="handshakePort" type="number" value="443"></div><div><label>short_id</label><input name="shortId" placeholder="0123456789abcdef" required></div></div><label>Reality 私钥</label><input name="privateKey" required>';if(type==='hysteria2')return '<div class="row"><div><label>上行 Mbps</label><input name="upMbps" type="number" min="0"></div><div><label>下行 Mbps</label><input name="downMbps" type="number" min="0"></div></div><label>TLS server_name</label><input name="tlsServerName" placeholder="example.com" required><label>伪装密码（可选）</label><input name="obfsPassword">';return '<label>加密方法</label><select name="method"><option value="2022-blake3-aes-128-gcm">2022-blake3-aes-128-gcm</option><option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</option><option value="2022-blake3-chacha20-poly1305">2022-blake3-chacha20-poly1305</option></select><label>主密码（留空由服务端生成）</label><input name="password"><label>网络</label><select name="network"><option value="tcp,udp">TCP + UDP</option><option value="tcp">TCP</option><option value="udp">UDP</option></select>'}
function open(kind){$('#modalTitle').textContent=kind==='inbound'?'新增入站':'新增客户端';$('#form').innerHTML=kind==='inbound'?'<div class="row"><div><label>名称</label><input name="name" required></div><div><label>协议</label><select name="type" id="protocol"><option value="reality">Reality（VLESS）</option><option value="hysteria2">Hysteria 2</option><option value="shadowsocks2022">Shadowsocks 2022</option></select></div></div><label>随机高位端口（1024-65535）</label><input name="port" type="number" min="1024" max="65535" required><div id="protocolFields"></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button>保存</button></div>':'<label>用户名（3-32 位）</label><input name="username" pattern="[A-Za-z0-9_-]{3,32}" required><label>管理员备注</label><input name="note"><div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button>保存</button></div>';
$('#modal').classList.add('open');if(kind==='inbound'){const p=$('#protocol');const redraw=()=>$('#protocolFields').innerHTML=protocolFields(p.value);p.onchange=redraw;redraw()}$('#form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api(kind==='inbound'?'/api/inbounds':'/api/clients',{method:'POST',body:JSON.stringify(kind==='inbound'?{...data,port:Number(data.port)}:data)});closeModal();await load()}catch(err){alert(err.message)}}}
function closeModal(){$('#modal').classList.remove('open')};window.closeModal=closeModal;window.removeInbound=async id=>{if(confirm('确认删除该入站？')){await api('/api/inbounds/'+id,{method:'DELETE'});load()}};
$('#addInbound').onclick=()=>open('inbound');$('#addClient').onclick=()=>open('client');$('#refresh').onclick=load;$('#updateBtn').onclick=async()=>{if(!confirm('确认备份并更新面板与全部核心？'))return;const result=await api('/api/updates/run',{method:'POST',body:JSON.stringify({scope:'all'})});alert(result.ok?'更新完成，已完成健康检查。':'更新失败，已自动回滚。');load()};load().catch(e=>alert(e.message));
</script></body></html>
