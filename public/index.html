<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KotaUI</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:28px;font-weight:800}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}.card{background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:18px;box-shadow:0 5px 16px #17203308}.metric{font-size:30px;font-weight:750;margin-top:8px}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h2{font-size:18px;margin:0}button{border:0;border-radius:9px;padding:9px 13px;background:#2457d6;color:white;cursor:pointer}button.secondary{background:#eef2ff;color:#2446a6}button.danger{background:#fee4e2;color:#b42318}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;font-size:14px}th{color:#667085;font-weight:600}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e9f8ef;color:#16723a;font-size:12px}.empty{color:#667085;padding:24px 0}.modal{position:fixed;inset:0;background:#10182866;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{width:min(520px,calc(100% - 32px));background:#fff;padding:22px;border-radius:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;color:#475467;display:block;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}@media(max-width:700px){.shell{padding:16px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="brand">KotaUI</div><div class="muted">sing-box 节点管理面板</div></div><button id="refresh" class="secondary">刷新数据</button></header>
<section class="grid"><div class="card"><div class="muted">服务状态</div><div class="metric" id="health">检查中</div></div><div class="card"><div class="muted">启用入站</div><div class="metric" id="inboundCount">0</div></div><div class="card"><div class="muted">客户端</div><div class="metric" id="clientCount">0</div></div></section>
<section class="card section"><div class="section-head"><h2>入站管理</h2><button id="addInbound">新增入站</button></div><div id="inbounds"></div></section>
<section class="card section"><div class="section-head"><h2>客户端管理</h2><button id="addClient">新增客户端</button></div><div id="clients"></div></section>
</main>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">新增</h2><form id="form"></form></div></div>
<script>
const $=s=>document.querySelector(s);let state;
async function api(url,opt){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){state=await api('/api/state');const h=await api('/api/health');$('#health').textContent=h.ok?'运行中':'异常';$('#inboundCount').textContent=state.inbounds.filter(x=>x.enabled).length;$('#clientCount').textContent=state.clients.length;render()}
function render(){const ins=state.inbounds;if(!ins.length)$('#inbounds').innerHTML='<div class="empty">暂无入站，请先新增一个节点入口。</div>';else $('#inbounds').innerHTML='<table><thead><tr><th>名称</th><th>协议</th><th>端口</th><th>状态</th><th></th></tr></thead><tbody>'+ins.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${x.port}</td><td><span class="pill">${x.enabled?'已启用':'已停用'}</span></td><td><button class="danger" onclick="removeInbound('${x.id}')">删除</button></td></tr>`).join('')+'</tbody></table>';
const cs=state.clients;if(!cs.length)$('#clients').innerHTML='<div class="empty">暂无客户端。</div>';else $('#clients').innerHTML='<table><thead><tr><th>用户名</th><th>备注</th><th>入站数</th><th>订阅</th><th>状态</th></tr></thead><tbody>'+cs.map(x=>`<tr><td><strong>${esc(x.username)}</strong></td><td>${esc(x.note)}</td><td>${x.inbounds.length}</td><td><a href="/kota-sub/${encodeURIComponent(x.username)}" target="_blank">查看订阅</a></td><td><span class="pill">${x.enabled?'启用':'暂停'}</span></td></tr>`).join('')+'</tbody></table>'}
function open(kind){$('#modalTitle').textContent=kind==='inbound'?'新增入站':'新增客户端';$('#form').innerHTML=kind==='inbound'?'<div class="row"><div><label>名称</label><input name="name" required></div><div><label>协议</label><select name="type"><option value="vless">vless</option><option value="vmess">vmess</option><option value="trojan">trojan</option><option value="hysteria2">hysteria2</option></select></div></div><label>端口</label><input name="port" type="number" min="1" max="65535" required><div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button>保存</button></div>':'<label>用户名（3-32 位）</label><input name="username" pattern="[A-Za-z0-9_-]{3,32}" required><label>管理员备注</label><input name="note"><div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button>保存</button></div>';$('#modal').classList.add('open');$('#form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api(kind==='inbound'?'/api/inbounds':'/api/clients',{method:'POST',body:JSON.stringify(kind==='inbound'?{...data,port:Number(data.port)}:data)});closeModal();await load()}catch(err){alert(err.message)}}}
function closeModal(){$('#modal').classList.remove('open')};window.closeModal=closeModal;window.removeInbound=async id=>{if(confirm('确认删除该入站？')){await api('/api/inbounds/'+id,{method:'DELETE'});load()}};$('#addInbound').onclick=()=>open('inbound');$('#addClient').onclick=()=>open('client');$('#refresh').onclick=load;load().catch(e=>alert(e.message));
</script></body></html>
